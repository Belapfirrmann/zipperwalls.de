# Connector + optional Caddy (holt automatisch ein HTTPS Zertifikat).
# Mit Caddy:  docker compose --profile caddy up -d --build
# Ohne Caddy: docker compose up -d --build  (dann leitet ein vorhandener Webserver
#             auf 127.0.0.1:3000 weiter, siehe README)
services:
  connector:
    build: .
    env_file: .env
    environment:
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - connector-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN} --to connector:3000
    volumes:
      - caddy-data:/data
    restart: unless-stopped
    depends_on:
      - connector

volumes:
  connector-data:
  caddy-data:
