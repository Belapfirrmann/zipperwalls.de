<title>Zipperwalls Social Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,700;0,800;0,900;1,900&display=swap">
<style>
/* Layout: feste dunkle Seitenleiste, Arbeitsfläche mit Karten. Zipperwalls Brand Kit:
   Gelb + Dunkel auf viel Weiß, Barlow, nur zwei runde Ecken (oben links, unten rechts). */
:root {
  --gelb: #FFCC20; --gelb-dunkel: #EFB800; --auf-gelb: #1D1D1B;
  --side: #1F2725; --side-text: #FFFFFF; --side-hover: rgba(255,255,255,.08);
  --bg: #F5F5F5; --card: #FFFFFF; --text: #1D1D1B; --grau: #4B4F58; --grau-hell: #808285;
  --flaeche: #F2F5F7; --linie: #ECEEF0; --rahmen: #C9CCD0; --chip: #E4E6E8;
  --dark-btn: #1F2725; --dark-btn-text: #FFFFFF;
  --p0: #FFCC20; --p1: #1F2725; --p2: #808285; --p3: #EFB800; --p4: #4B4F58; --p5: #C9CCD0; --p6: #000000;
  --shadow: 0 0 7px rgba(0,0,0,.15);
  --r-klein: 8px; --r: 12px; --r-gross: 30px;
  --font: 'Barlow', 'Arial Narrow', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --side: #141A19; --side-hover: rgba(255,255,255,.06);
  --bg: #1F2725; --card: #283230; --text: #F2F5F7; --grau: #BFC4C9; --grau-hell: #8E9399;
  --flaeche: #313C3A; --linie: #3A4644; --rahmen: #4B5654; --chip: #3A4644;
  --dark-btn: #F2F5F7; --dark-btn-text: #1D1D1B;
  --p1: #F2F5F7; --p4: #8E9399; --p5: #4B5654; --p6: #BFC4C9;
  --shadow: 0 0 7px rgba(0,0,0,.4); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --side: #141A19; --side-hover: rgba(255,255,255,.06);
  --bg: #1F2725; --card: #283230; --text: #F2F5F7; --grau: #BFC4C9; --grau-hell: #8E9399;
  --flaeche: #313C3A; --linie: #3A4644; --rahmen: #4B5654; --chip: #3A4644;
  --dark-btn: #F2F5F7; --dark-btn-text: #1D1D1B;
  --p1: #F2F5F7; --p4: #8E9399; --p5: #4B5654; --p6: #BFC4C9;
  --shadow: 0 0 7px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--bg); font-size: 17px; line-height: 1.55; }
h1, h2, h3 { font-weight: 900; text-transform: uppercase; line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: 40px; font-style: italic; }
h2 { font-size: 24px; }
h3 { font-size: 18px; }
p { margin: 0 0 .6em; }
a { color: var(--text); text-decoration-color: var(--gelb-dunkel); text-decoration-thickness: 2px; text-underline-offset: 3px; }
code { font-size: 14px; background: var(--flaeche); padding: 1px 5px; }
.muted { color: var(--grau); }
.small { font-size: 15px; }
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-text); padding: 28px 20px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; gap: 32px; }
.logo { width: 150px; display: block; }
.logo svg { width: 100%; height: auto; display: block; }
nav { display: flex; flex-direction: column; gap: 4px; }
nav a { color: var(--side-text); text-decoration: none; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 14px; padding: 12px 14px; border-radius: var(--r-klein) 0 var(--r-klein) 0; display: flex; justify-content: space-between; align-items: center; }
nav a:hover { background: var(--side-hover); }
nav a.active { background: var(--gelb); color: var(--auf-gelb); }
.count { background: var(--gelb); color: var(--auf-gelb); border-radius: 50%; min-width: 24px; height: 24px; display: inline-grid; place-items: center; font-size: 13px; margin-left: 8px; }
nav a.active .count { background: var(--auf-gelb); color: var(--gelb); }
.who { margin-top: auto; font-size: 13px; color: #9AA0A6; }
main { padding: 36px 40px 80px; max-width: 1180px; width: 100%; min-width: 0; }
.head { margin-bottom: 28px; }
.head p { color: var(--grau); max-width: 65ch; margin-top: 10px; }
.card { background: var(--card); border-radius: var(--r-gross) 0 var(--r-gross) 0; box-shadow: var(--shadow); padding: 26px; min-width: 0; }
.grid { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); }
.section { margin-bottom: 36px; }
.section > h2 { margin-bottom: 14px; }
.label { font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--grau); }
.badge { display: inline-block; background: var(--gelb); color: var(--auf-gelb); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; padding: 4px 12px; border-radius: var(--r-klein) 0 var(--r-klein) 0; }
.badge.dark { background: var(--dark-btn); color: var(--dark-btn-text); }
.badge.grey { background: var(--chip); color: var(--grau); }
.badge.tiny { font-size: 10px; padding: 2px 8px; }
.btn { background: var(--gelb); color: var(--auf-gelb); border: 0; padding: 12px 22px; font: 700 16px var(--font); border-radius: var(--r) 0 var(--r) 0; cursor: pointer; text-decoration: none; display: inline-block; transition: background .2s; }
.btn:hover { background: var(--gelb-dunkel); }
.btn.dark { background: var(--dark-btn); color: var(--dark-btn-text); }
.btn.ghost { background: var(--flaeche); color: var(--text); }
.btn.ghost:hover { background: var(--chip); }
.btn.armed { outline: 3px solid var(--gelb-dunkel); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.statlist { margin-top: 10px; display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.pillars { display: flex; height: 44px; border-radius: var(--r) 0 var(--r) 0; overflow: hidden; margin: 14px 0 18px; }
.pillars div { display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #FFFFFF; }
.pillars .p0, .pillars .p3, .pillars .p5 { color: #1D1D1B; }
.p0 { background: var(--p0); } .p1 { background: var(--p1); } .p2 { background: var(--p2); } .p3 { background: var(--p3); }
.p4 { background: var(--p4); } .p5 { background: var(--p5); } .p6 { background: var(--p6); }
:root[data-theme="dark"] .pillars .p1, :root[data-theme="dark"] .pillars .p6 { color: #1D1D1B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pillars .p1, :root:not([data-theme="light"]) .pillars .p6 { color: #1D1D1B; } }
.b0 { border-color: var(--p0); } .b1 { border-color: var(--p1); } .b2 { border-color: var(--p2); } .b3 { border-color: var(--p3); }
.b4 { border-color: var(--p4); } .b5 { border-color: var(--p5); } .b6 { border-color: var(--p6); }
.swatch { width: 14px; height: 14px; flex: none; border-radius: 3px 0 3px 0; display: inline-block; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
.week div { text-align: center; padding: 10px 2px; border-radius: var(--r-klein) 0 var(--r-klein) 0; background: var(--flaeche); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--grau-hell); }
.week div.on { background: var(--gelb); color: var(--auf-gelb); }
.notice { border-left: 6px solid var(--gelb); background: var(--card); padding: 14px 18px; margin-bottom: 24px; box-shadow: var(--shadow); }
.pending { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-bottom: 16px; }
input[type=text], input[type=datetime-local], textarea { width: 100%; font: 400 16px var(--font); padding: 10px 12px; border: 1px solid var(--rahmen); border-radius: var(--r-klein) 0 var(--r-klein) 0; background: var(--card); color: var(--text); }
textarea { min-height: 220px; resize: vertical; }
input:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 3px solid var(--gelb-dunkel); outline-offset: 2px; }
.field { margin-bottom: 14px; }
.field > .label { display: block; margin-bottom: 6px; }
.post { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; margin-bottom: 20px; }
.post .img { width: 100%; max-width: 100%; object-fit: cover; background: var(--flaeche); border-radius: var(--r) 0 var(--r) 0; display: grid; place-items: center; color: var(--grau-hell); aspect-ratio: 4 / 5; }
.post .img.sq { aspect-ratio: 1; max-width: 160px; }
.counter { font-size: 13px; color: var(--grau); text-align: right; font-variant-numeric: tabular-nums; }
.counter.over { color: var(--text); font-weight: 800; }
.chan { display: flex; gap: 6px; align-items: center; font-weight: 700; }
.results { margin-top: 14px; display: grid; gap: 6px; font-size: 15px; }
.results .err, .open-point { background: var(--flaeche); border-left: 4px solid var(--text); padding: 8px 12px; font-size: 15px; }
.open-point { margin: 10px 0 0; }
details { margin: 8px 0 14px; }
summary { cursor: pointer; font-weight: 700; }
.pre { white-space: pre-wrap; background: var(--flaeche); padding: 12px; font-size: 15px; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
.tab { border: 0; background: var(--flaeche); font: 700 14px var(--font); padding: 8px 14px; cursor: pointer; border-radius: var(--r-klein) 0 var(--r-klein) 0; color: var(--text); }
.tab.on { background: var(--dark-btn); color: var(--dark-btn-text); }
.check { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--linie); cursor: pointer; position: relative; }
.check:last-child { border-bottom: 0; }
.check input { position: absolute; opacity: 0; }
.box { width: 28px; height: 28px; flex: none; border: 2px solid var(--text); border-radius: 8px 0 8px 0; display: grid; place-items: center; background: var(--card); }
.check input:checked + .box { background: var(--gelb); border-color: var(--auf-gelb); }
.check input:checked + .box::after { content: ''; width: 12px; height: 7px; border-left: 3px solid var(--auf-gelb); border-bottom: 3px solid var(--auf-gelb); transform: rotate(-45deg) translate(1px, -1px); }
.check input:focus-visible + .box { outline: 3px solid var(--gelb-dunkel); outline-offset: 2px; }
.check.done .t { color: var(--grau-hell); text-decoration: line-through; }
.check small { display: block; color: var(--grau-hell); }
.progress { height: 10px; background: var(--chip); border-radius: 5px 0 5px 0; overflow: hidden; margin: 10px 0 4px; }
.progress div { height: 100%; background: var(--gelb); }
.kpi .num { font-size: 44px; font-weight: 900; font-style: italic; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .delta { color: var(--grau); font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--grau); padding: 8px 10px; border-bottom: 2px solid var(--text); }
td { padding: 10px; border-bottom: 1px solid var(--linie); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.empty { text-align: center; padding: 40px 20px; color: var(--grau); }
.chart { width: 100%; height: auto; margin-top: 10px; }
.chart text { font-family: var(--font); font-size: 12px; fill: var(--grau); }
.chart .axis { stroke: var(--rahmen); }
.chart .line { fill: none; stroke: var(--text); stroke-width: 2.5; stroke-linejoin: round; }
.chart .dot { fill: var(--gelb); stroke: var(--text); stroke-width: 2; }
.conn { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
.kw { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; margin-bottom: 22px; }
.kw-label { display: flex; flex-direction: column; align-items: center; padding-top: 14px; }
.kw-label strong { font-size: 30px; font-weight: 900; font-style: italic; line-height: 1; }
.entry { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 18px; padding: 20px 22px; border-radius: var(--r) 0 var(--r) 0; }
.entry.past { opacity: .6; }
.entry-date { font-size: 15px; }
.entry-date strong { display: block; font-size: 22px; font-weight: 900; text-transform: uppercase; }
.entry details { margin: 8px 0 0; }
.pill-tag { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; border-left: 6px solid; padding: 2px 8px; background: var(--flaeche); }
.toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translate(-50%, 20px); background: var(--side); color: #FFFFFF; padding: 12px 22px; border-radius: var(--r) 0 var(--r) 0; opacity: 0; pointer-events: none; transition: .25s; z-index: 10; max-width: 90vw; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 14px 16px; gap: 14px; }
  .logo { width: 110px; }
  nav { flex-direction: row; flex-wrap: wrap; width: 100%; }
  nav a { padding: 8px 10px; font-size: 12px; }
  .who { display: none; }
  main { padding: 24px 16px 80px; }
  h1 { font-size: 30px; }
  .post { grid-template-columns: minmax(0, 1fr); }
  .post .img { max-width: 260px; }
  .kw { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .kw-label { flex-direction: row; gap: 8px; padding: 0; justify-content: flex-start; }
  .entry { grid-template-columns: minmax(0, 1fr); gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { .toast, .btn { transition: none; } }
.head .label { display: block; overflow-wrap: anywhere; }
.side { padding-top: 32px; }
.logo { padding: 4px 0 8px; }
.setup { margin-top: 20px; }
.setup summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; }
.setup summary::-webkit-details-marker { display: none; }
.setup summary::after { content: '+'; font-size: 28px; font-weight: 900; margin-left: auto; color: var(--grau); }
.setup[open] summary::after { content: '\2212'; }
.setup ol { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 8px; max-width: 75ch; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
.improve { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--linie); }
.improve .label { display: block; margin-bottom: 6px; }
.improve-row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.improve-row textarea { min-height: 64px; flex: 1 1 260px; }
.improve-row .btn { align-self: flex-end; }
.improve p { margin: 6px 0 0; }

.slides { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; max-width: 100%; }
.slides img { flex: 0 0 82%; max-width: 82%; aspect-ratio: 4 / 5; object-fit: cover; scroll-snap-align: start; border-radius: var(--r) 0 var(--r) 0; background: var(--flaeche); }

/* Freigabe: Umschalter Social Media / Newsletter */
.parts { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 6px; }
.part { flex: 1 1 200px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; background: var(--card); color: var(--text); text-decoration: none; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; font-size: 16px; border-radius: var(--r) 0 var(--r) 0; box-shadow: var(--shadow); }
.part:hover { background: var(--flaeche); }
.part.on { background: var(--gelb); color: var(--auf-gelb); }
.part-n { font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: none; color: inherit; opacity: .8; }

/* Newsletter */
.steps { margin: 12px 0 0; padding-left: 22px; display: grid; gap: 8px; max-width: 75ch; }
.nl { margin-bottom: 24px; }
.nl-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 6px; }
.nl-top h2 { font-size: 26px; text-transform: none; font-style: normal; }
.nl-body { display: grid; grid-template-columns: minmax(0, 640px) minmax(0, 1fr); gap: 26px; margin-top: 18px; align-items: start; }
.nl-preview { background: #F2F5F7; border-radius: var(--r) 0 var(--r) 0; overflow: hidden; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.nl-inbox { display: grid; gap: 2px; padding: 12px 16px; background: #FFFFFF; color: #1D1D1B; border-bottom: 1px solid #D9DDE0; font-size: 15px; }
.nl-inbox .label { font-size: 11px; color: #4B4F58; }
.nl-inbox .muted { color: #4B4F58; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nl-frame { display: block; width: 100%; height: 760px; border: 0; background: #F2F5F7; }
.nl-sec { margin: 0 0 10px; padding: 12px 16px 4px; background: var(--flaeche); border-radius: var(--r) 0 var(--r) 0; }
.nl-sec summary { font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; margin-bottom: 10px; }
.nl-sec:not([open]) summary { margin-bottom: 8px; }
.nl textarea.long { min-height: 380px; }
.nl textarea.short { min-height: 80px; }
.nl .improve textarea { min-height: 64px; }
.kpis { margin-top: 18px; display: grid; gap: 8px; }
.kpi-in { display: grid; gap: 4px; flex: 1 1 130px; }
.kpis .row { align-items: flex-end; }
@media (max-width: 1100px) { .nl-body { grid-template-columns: minmax(0, 1fr); } .nl-preview { position: static; } .nl-frame { height: 640px; } }

/* Versandtermin in der Newsletter-Karte */
.nl-side { display: grid; gap: 10px; flex: 0 1 340px; }
.nl-when { display: grid; gap: 2px; padding: 12px 18px; background: var(--gelb); color: var(--auf-gelb); border-radius: var(--r) 0 var(--r) 0; }
.nl-when .label { color: var(--auf-gelb); font-size: 12px; }
.nl-when strong { font-size: 22px; font-weight: 900; line-height: 1.1; }
.nl-when-time { font-size: 18px; font-weight: 800; }
.nl-when .muted { color: var(--auf-gelb); opacity: .75; }
.nl-next { margin: 12px 0 0; padding: 10px 14px; background: var(--flaeche); border-left: 4px solid var(--grau); font-size: 15px; }
.nl-next.warn { border-left-color: var(--gelb-dunkel); }

/* Vollbild-Vorschau */
.nl-full { position: fixed; inset: 0; z-index: 20; background: rgba(20, 26, 25, .92); display: flex; flex-direction: column; }
.nl-full-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 14px; background: var(--card); color: var(--text); }
.nl-subject { font-weight: 800; font-size: 18px; }
.nl-full-stage { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.nl-full-frame { width: 680px; max-width: 100%; min-height: 100%; border: 0; background: #F2F5F7; border-radius: var(--r) 0 var(--r) 0; box-shadow: 0 0 24px rgba(0,0,0,.4); }

/* Zahlen: Plattformfarben (validiert hell und dunkel, mit Legende und Tabelle) */
:root { --c-facebook: #2a78d6; --c-instagram: #eb6834; --c-linkedin: #1baf7a; --c-bar: var(--grau); --heat: #EFB800; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-facebook: #3987e5; --c-instagram: #d95926; --c-linkedin: #199e70; --c-bar: #BFC4C9; } }
:root[data-theme="dark"] { --c-facebook: #3987e5; --c-instagram: #d95926; --c-linkedin: #199e70; --c-bar: #BFC4C9; }
.filters { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
.filters .muted { margin-left: 10px; }
.spread { justify-content: space-between; align-items: flex-start; gap: 16px; }
.zk { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1280px) { .zk { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 620px) { .zk { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.zk .kpi { padding: 20px; }
.zk .kpi .num { font-size: 34px; margin: 6px 0 4px; overflow-wrap: anywhere; }
.zk .kpi .label { font-size: 12px; }
.kpi .hint { color: var(--grau-hell); font-size: 13px; margin-top: 2px; }
.dl { font-weight: 800; color: var(--text); }
.dl.up::before { content: '▲ '; font-size: 10px; }
.dl.down::before { content: '▼ '; font-size: 10px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; margin-top: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i, .zch h3 i, i.dot, .ztip i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: none; }
i.dot { width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.zch h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.zsplit { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(220px, 1fr); gap: 28px; align-items: start; margin-top: 4px; }
.zsplit > div:last-child { padding-top: 46px; }
.zc .grid { stroke: var(--linie); }
.zc .hit { fill: transparent; cursor: default; outline: none; }
.zc .hit:hover, .zc .hit:focus-visible { fill: var(--text); fill-opacity: .06; }
.zc .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.zc .end { stroke: var(--card); stroke-width: 2; pointer-events: none; }
.zc .lbl { fill: var(--text); font-weight: 800; font-size: 13px; }
.zc path { pointer-events: none; }
.hbars { display: grid; gap: 10px; }
.hb { display: grid; grid-template-columns: minmax(80px, 34%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; outline: none; }
.hb:focus-visible { outline: 2px solid var(--gelb-dunkel); outline-offset: 2px; }
.hb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-track { height: 14px; background: var(--flaeche); border-radius: 0 4px 4px 0; overflow: hidden; }
.hb-track span { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-v { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.hb-v .muted { font-weight: 400; font-size: 13px; }
.zch dl { display: grid; grid-template-columns: 1fr auto; margin: 0; font-size: 15px; }
.zch dt, .zch dd { padding: 7px 0; border-bottom: 1px solid var(--linie); margin: 0; }
.zch dd { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.heat { display: grid; gap: 3px; font-size: 12px; color: var(--grau); }
.hrow { display: grid; grid-template-columns: 26px repeat(14, minmax(0, 1fr)); gap: 3px; align-items: center; }
.hh { text-align: center; }
.hc { height: 20px; background: var(--flaeche); border-radius: 3px; }
.hc.on { background: color-mix(in srgb, var(--heat) var(--a), var(--flaeche)); outline: none; }
.hc.on:hover, .hc.on:focus-visible { box-shadow: inset 0 0 0 2px var(--text); }
.hours { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; height: 90px; align-items: end; }
.hbar { height: 100%; display: flex; align-items: flex-end; outline: none; }
.hbar span { display: block; width: 100%; background: var(--c-instagram); border-radius: 3px 3px 0 0; min-height: 2px; }
.hbar:hover span, .hbar:focus-visible span { opacity: .75; }
.hours-x { display: flex; justify-content: space-between; font-size: 12px; color: var(--grau); margin-top: 4px; }
.top { display: grid; grid-template-columns: 30px 84px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 22px; }
.top img, .top .noimg { width: 84px; height: 84px; object-fit: cover; border-radius: var(--r-klein) 0 var(--r-klein) 0; background: var(--flaeche); }
.top .rank { font-size: 30px; font-weight: 900; font-style: italic; }
.topnum { display: grid; text-align: right; }
.topnum .num { font-size: 32px; font-weight: 900; font-style: italic; line-height: 1; }
.ztable th button { all: unset; cursor: pointer; }
.ztable th button:focus-visible { outline: 2px solid var(--gelb-dunkel); }
.ztable td { white-space: nowrap; }
.ztable td:first-child { white-space: normal; min-width: 220px; }
.ztip { position: fixed; z-index: 50; pointer-events: none; background: var(--card); color: var(--text); box-shadow: 0 4px 18px rgba(0,0,0,.18); padding: 10px 12px; border-radius: 8px 0 8px 0; font-size: 14px; min-width: 150px; opacity: 0; transition: opacity .1s; }
.ztip.show { opacity: 1; }
.ztip .tt { color: var(--grau); font-size: 12px; margin-bottom: 4px; }
.ztip .tr { display: flex; align-items: center; gap: 8px; }
.ztip .tr i { width: 12px; height: 3px; border-radius: 2px; }
.ztip .tr span { color: var(--grau); }
@media (max-width: 760px) {
  .zsplit { grid-template-columns: 1fr; }
  .zsplit > div:last-child { padding-top: 0; }
  .top { grid-template-columns: 56px minmax(0, 1fr); }
  .top .rank { display: none; }
  .top img, .top .noimg { width: 56px; height: 56px; }
  .topnum { grid-column: 2; text-align: left; }
}
.zk .kpi .label { letter-spacing: .06em; overflow-wrap: anywhere; }
@media (max-width: 620px) { .zc text { font-size: 22px; } .zc .lbl { font-size: 22px; } }
.zk .kpi .label { display: block; line-height: 1.3; min-height: 2.6em; }
.entry-act { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.create-hint { text-align: right; max-width: 140px; }
@media (max-width: 760px) { .entry-act { align-items: flex-start; } .create-hint { text-align: left; } }

enturen, Behörden und Vereine mit Messewänden, Messeständen und Messetheken aus, jeweils inklusive Druck. Unsere Systeme bauen Sie ohne Werkzeug auf, und bei Fragen erreichen Sie uns persönlich.\nAb jetzt finden Sie hier regelmäßig Produktneuheiten, Praxistipps für Ihre Messeplanung und Einblicke hinter die Kulissen. Wir freuen uns auf den Austausch.","linkedin":"Zipperwalls: Messewände, Messestände und Messeausstattung für B2B-Aussteller.\n\nSeit 2019 beliefern wir Industrie, Handel, Handwerk, Agenturen, Behörden und Vereine mit modularen Messesystemen inklusive Druck. Über 950 Produkte, werkzeugloser Aufbau und eine persönliche Beratung, die unsere Kunden bei Trusted Shops mit 4,77 von 5 bewerten.\n\nAuf dieser Seite teilen wir ab sofort regelmäßig Wissen rund um Messeplanung, Standgestaltung und Messetechnik. Folgen Sie uns, wenn Ihr nächster Messeauftritt schon in Planung ist.","hashtags":["#zipperwalls","#messewand","#messestand","#messebau","#messeauftritt"],"files":["KW 41/post-01-instagram-facebook.png","KW 41/post-01-linkedin.png"],"note":"Voraussetzung: Instagram-Account @zipperwalls.de angelegt, Facebook-Infos (Adresse, Telefon, Öffnungszeiten) korrigiert. Als Testpost am 04.10.2026 veröffentlicht.","status":"Gepostet"},{"nr":2,"kw":41,"date":"2026-10-06","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #01: Frühjahrsmessen 2027 jetzt planen","format":"Bildpost 4:5 (optional Karussell)","headline":"FRÜHJAHRSMESSE? JETZT PLANEN.","instagram":"Messe-Tipp #01: Frühjahrsmesse? Jetzt planen.\nWer im Januar bis März ausstellt, legt die Grundlagen im Herbst. Standmaße klären, Druckdaten mit Vorlauf anlegen, Lieferzeit und einen Probeaufbau einplanen.\nSpeichern Sie sich den Tipp für Ihre Messeplanung.","facebook":"Messe-Tipp #01: Die Frühjahrsmessen 2027 beginnen im Herbst.\nDamit im Januar alles steht, lohnen sich jetzt drei Schritte: Standmaße und Standart (Reihe, Ecke, Kopf) klären, Druckdaten mit ausreichend Vorlauf anlegen und Lieferzeit samt Probeaufbau im Büro einplanen.\nSie sind unsicher bei Größe oder Gestaltung? Wir beraten Sie gern persönlich.","linkedin":"Die Frühjahrsmessen 2027 entscheiden sich im Herbst 2026.\n\nIn der Praxis sehen wir immer wieder: Nicht der Aufbau wird knapp, sondern die Zeit davor. Drei Punkte, die wir Ausstellern jetzt empfehlen:\n\n1. Standmaße und Standart (Reihen-, Eck- oder Kopfstand) verbindlich klären.\n2. Druckdaten mit Vorlauf anlegen, inklusive Korrekturschleife.\n3. Lieferzeit und einen Probeaufbau vor der Messe fest einplanen.\n\nWer diese drei Punkte bis Jahresende abhakt, startet entspannt in die Messesaison.","hashtags":["#messetipp","#messeplanung","#messestand","#messeauftritt","#zipperwalls"],"files":["KW 41/post-02-instagram-facebook.png","KW 41/post-02-linkedin.png"],"note":null,"status":"Entwurf"},{"nr":3,"kw":41,"date":"2026-10-08","day":"Do","pillar":"Produkte & Anwendung","topic":"Messewand EASE L: in Minuten aufgebaut","format":"Bildpost 4:5","headline":"IN MINUTEN AUFGEBAUT. OHNE WERKZEUG.","instagram":"In Minuten aufgebaut. Ohne Werkzeug.\nDie Messewand EASE L verbindet einen Aluminiumrahmen im Klicksystem mit einem passgenauen Stoffdruck. Der Druck ist B1-zertifiziert, austauschbar und bei 30 °C waschbar.\nJetzt konfigurieren auf zipperwalls.de","facebook":"Eine Rückwand, die eine Person allein aufbaut.\nDie Messewand EASE L besteht aus einem leichten Aluminiumrahmen im Klicksystem und einem bedruckten Stoffbezug mit Reißverschluss. Erhältlich von 240 bis 600 cm Breite, ein- oder beidseitig bedruckt, wahlweise mit Tragetasche oder Trolley.\nDer Stoff ist B1-zertifiziert und bei 30 °C waschbar. Für die nächste Kampagne tauschen Sie nur den Druck. Jetzt konfigurieren auf zipperwalls.de","linkedin":"Werkzeugloser Aufbau ist kein Komfortmerkmal, sondern ein Kostenfaktor.\n\nDie Messewand EASE L baut eine Person in wenigen Minuten auf: Aluminiumrahmen im Klicksystem, Stoffbezug mit Reißverschluss, fertig. Kein Messebauer, kein Werkzeug, Transport im PKW.\n\nZur Auswahl stehen Breiten von 240 bis 600 cm, ein- oder beidseitiger Druck sowie Tragetasche oder Trolley. Der Stoff ist B1-zertifiziert, waschbar bei 30 °C und für den nächsten Auftritt einfach austauschbar.\n\nDetails und Konfiguration auf zipperwalls.de","hashtags":["#messewand","#messestand","#messebau","#textildruck","#zipperwalls"],"files":["KW 42/post-03-instagram-facebook.png","KW 42/post-03-linkedin.png"],"note":"Produktrender stammt von zipperwalls.de. Für spätere Posts echte Aufbaufotos sammeln.","status":"Entwurf"},{"nr":25,"kw":42,"date":"2026-10-13","day":"Di","pillar":"Hinter den Kulissen","topic":"Hinter den Kulissen: So läuft Ihre Bestellung ab","format":"Karussell (6 Slides: Titel, 4 Schritte, Abschluss)","headline":"VON DER IDEE ZUR MESSEWAND.","instagram":"So läuft Ihre Bestellung bei Zipperwalls ab.\nVon der ersten Idee bis zur fertigen Messewand in vier Schritten:\n\n1. Produkt konfigurieren\nIm Shop wählen Sie Größe, ein- oder beidseitigen Druck und die Transportlösung, zum Beispiel Tasche oder Trolley. Bei Fragen zu Größe oder Ausstattung beraten wir Sie persönlich, Mo bis Fr von 8 bis 17 Uhr.\n\n2. Druckdaten anlegen\nSie legen Ihr Motiv in der Druckvorlage des jeweiligen Produkts an. Keine eigenen Daten? Unser Grafikservice gestaltet Ihr Layout oder passt vorhandene Dateien an.\n\n3. Daten prüfen\nVor der Produktion werden Ihre Druckdaten geprüft, zum Beispiel auf Auflösung, Schriften und Farbraum. So fallen Fehler auf, bevor gedruckt wird.\n\n4. Produktion und Versand\nIhr Stoffdruck entsteht im Sublimationsverfahren, B1-zertifiziert und bei 30 °C waschbar. Danach geht alles fertig verpackt auf den Weg zu Ihnen.\n\nFragen zu Ihrem Projekt? Wir sind persönlich für Sie da.","facebook":"Von der Idee zur fertigen Messewand: So läuft Ihre Bestellung bei Zipperwalls ab.\n\n1. Produkt konfigurieren\nIm Shop wählen Sie Größe, ein- oder beidseitigen Druck und die Transportlösung, zum Beispiel Tasche oder Trolley. Bei Fragen zu Größe oder Ausstattung beraten wir Sie persönlich, Mo bis Fr von 8 bis 17 Uhr.\n\n2. Druckdaten anlegen\nSie legen Ihr Motiv in der Druckvorlage des jeweiligen Produkts an. Keine eigenen Daten? Unser Grafikservice gestaltet Ihr Layout oder passt vorhandene Dateien an.\n\n3. Daten prüfen\nVor der Produktion werden Ihre Druckdaten geprüft, zum Beispiel auf Auflösung, Schriften und Farbraum. So fallen Fehler auf, bevor gedruckt wird.\n\n4. Produktion und Versand\nIhr Stoffdruck entsteht im Sublimationsverfahren, B1-zertifiziert und bei 30 °C waschbar. Danach geht alles fertig verpackt auf den Weg zu Ihnen.\n\nFragen zu Ihrem Projekt? Sie erreichen uns Mo bis Fr von 8 bis 17 Uhr unter +49 7276 4049970.","linkedin":"Ein Messeauftritt beginnt lange vor dem Aufbau. So läuft eine Bestellung bei Zipperwalls ab:\n\n1. Produkt konfigurieren\nIm Shop wählen Sie Größe, ein- oder beidseitigen Druck und die Transportlösung, zum Beispiel Tasche oder Trolley. Bei Fragen zu Größe oder Ausstattung beraten wir Sie persönlich, Mo bis Fr von 8 bis 17 Uhr.\n\n2. Druckdaten anlegen\nSie legen Ihr Motiv in der Druckvorlage des jeweiligen Produkts an. Keine eigenen Daten? Unser Grafikservice gestaltet Ihr Layout oder passt vorhandene Dateien an.\n\n3. Daten prüfen\nVor der Produktion werden Ihre Druckdaten geprüft, zum Beispiel auf Auflösung, Schriften und Farbraum. So fallen Fehler auf, bevor gedruckt wird.\n\n4. Produktion und Versand\nIhr Stoffdruck entsteht im Sublimationsverfahren, B1-zertifiziert und bei 30 °C waschbar. Danach geht alles fertig verpackt auf den Weg zu Ihnen.\n\nSo wissen Sie bei jedem Schritt, woran Sie sind. Fragen zu Ihrem Projekt beantworten wir gern persönlich.","hashtags":["#hinterdenkulissen","#messewand","#textildruck","#messestand","#zipperwalls"],"files":[],"note":"Neu eingefügt am 04.10.2026 für den freien Termin am 13.10. (ersetzt den Druckdaten-Check, der sich mit Newsletter Nr. 4 doppelte). Vor Veröffentlichung prüfen: Ablauf des Datenchecks und Versand so korrekt beschrieben?","status":"Entwurf"},{"nr":4,"kw":42,"date":"2026-10-15","day":"Do","pillar":"Kundenstimmen","topic":"Kundenstimme: persönliche Betreuung","format":"Bildpost 4:5","headline":"Persönliche Betreuung ist heute nicht mehr selbstverständlich.","instagram":"Was unsere Kunden am häufigsten hervorheben, ist nicht das Produkt, sondern die Betreuung.\nDanke für diese Bewertung. Bei Fragen zu Größe, Druck oder Lieferzeit erreichen Sie uns Mo bis Fr von 8 bis 17 Uhr persönlich.","facebook":"\"Persönliche Betreuung ist heute nicht mehr selbstverständlich.\"\nDiese Bewertung freut uns besonders, weil sie genau das trifft, was uns wichtig ist. Bei Zipperwalls sprechen Sie mit Menschen, die Ihr Projekt kennen: bei der Auswahl, bei den Druckdaten und bis zur Lieferung.\nSie erreichen uns Mo bis Fr von 8 bis 17 Uhr unter +49 7276 4049970.","linkedin":"Was Kunden über uns schreiben, ist aufschlussreicher als jeder Werbetext.\n\nIn unseren verifizierten Trusted-Shops-Bewertungen (aktuell 4,77 von 5) wird ein Punkt mit Abstand am häufigsten genannt: die persönliche Betreuung. Erreichbarkeit, schnelle Rückmeldungen und klare Absprachen.\n\nFür uns ist das der Maßstab. Messeprojekte haben feste Termine, und wer ausstellt, braucht einen Ansprechpartner, der zuverlässig antwortet.","hashtags":["#kundenstimme","#messestand","#messeauftritt","#zipperwalls"],"files":["KW 42/post-04-instagram-facebook.png","KW 42/post-04-linkedin.png"],"note":"Vor Veröffentlichung Nutzungsbedingungen von Trusted Shops für Zitate in Werbung prüfen. Bewertungsnote 4,77 aktuell halten.","status":"Entwurf"},{"nr":5,"kw":43,"date":"2026-10-20","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #02: Der Motten-Effekt (Licht zieht Besucher an)","format":"Bildpost 4:5","headline":"LICHT ZIEHT BESUCHER AN.","instagram":"Messe-Tipp #02: Licht zieht Besucher an.\nIn einer hellen Halle fällt auf, was selbst leuchtet. Hinterleuchtete Textilwände erzeugen Fernwirkung, schon bevor Besucher vor Ihrem Stand stehen.\nMehr dazu im Ratgeber auf zipperwalls.de/wissen","facebook":"Messe-Tipp #02: der Motten-Effekt.\nBesucher orientieren sich in Messehallen an hellen Flächen. Eine hinterleuchtete Rückwand wirkt deshalb deutlich weiter in den Gang hinein als ein klassisch angestrahlter Druck.\nWorauf es dabei ankommt, lesen Sie in unserem Ratgeber auf zipperwalls.de/wissen","linkedin":"Der Motten-Effekt auf Messen: Was leuchtet, wird gesehen.\n\nIn gleichmäßig ausgeleuchteten Hallen setzen sich selbstleuchtende Flächen klar ab. LED-Textilwände nutzen diesen Effekt: gleichmäßig hinterleuchtet, ohne Blendung, mit Fernwirkung in den Gang.\n\nUnser Ratgeber zeigt, wie Sie Licht gezielt einsetzen und welche Systeme sich für welche Standgröße eignen: zipperwalls.de/wissen","hashtags":["#messetipp","#ledwand","#messedesign","#messestand","#zipperwalls"],"files":["KW 43/post-05-instagram-facebook.png","KW 43/post-05-linkedin.png"],"note":"Basis: Ratgeber 'Motten-Effekt' (16.03.2026).","status":"Entwurf"},{"nr":6,"kw":43,"date":"2026-10-22","day":"Do","pillar":"Produkte & Anwendung","topic":"LED-Messewand / PIXLIP GO: leuchtende Rückwand","format":"Bildpost 4:5 oder Reel","headline":"IHRE RÜCKWAND LEUCHTET.","instagram":"Ihre Rückwand leuchtet.\nLED-Messewände und Lightboxen wie PIXLIP GO bringen Ihr Motiv gleichmäßig hinterleuchtet in den Gang. Modular, mit Textildruck und schnell aufgebaut.\nMehr im Shop auf zipperwalls.de","facebook":"Wenn Ihr Stand auch in einer vollen Halle auffallen soll: LED-Messewände und Lightboxen wie die PIXLIP GO setzen Ihr Motiv gleichmäßig in Szene. Modular kombinierbar, mit beidseitigem Textildruck und ohne Werkzeug aufgebaut.\nAlle Modelle finden Sie auf zipperwalls.de","linkedin":"Leuchtende Textilwände sind auf Messen längst Standard. Entscheidend ist, wie schnell sie stehen.\n\nModulare Lightbox-Systeme wie PIXLIP GO verbinden gleichmäßige Hinterleuchtung mit werkzeuglosem Aufbau. Einzelne Module lassen sich zu größeren Wänden kombinieren und für den nächsten Auftritt neu bespannen.\n\nÜbersicht über LED-Messewände und Lightboxen: zipperwalls.de","hashtags":["#ledwand","#lightbox","#pixlip","#messestand","#zipperwalls"],"files":["KW 43/post-06-instagram-facebook.png","KW 43/post-06-linkedin.png"],"note":"Bild von zipperwalls.de holen.","status":"Entwurf"},{"nr":7,"kw":44,"date":"2026-10-27","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #03: Kompletter Messestand im PKW","format":"Bildpost 4:5","headline":"IHR STAND PASST INS AUTO.","instagram":"Messe-Tipp #03: Ihr Stand passt ins Auto.\nTextile Messesysteme reisen zerlegt in Tasche oder Trolley. Das spart Spedition, Lagerfläche und Abstimmung mit dem Messebauer.\nMehr im Ratgeber auf zipperwalls.de/wissen","facebook":"Messe-Tipp #03: Nie wieder Spedition.\nEin kompletter Messestand aus Textilwänden und Theke passt in den Kofferraum eines Kombis. Rahmen zerlegt in Tasche oder Trolley, Stoffdrucke knitterarm gefaltet.\nWie das in der Praxis aussieht, zeigt unser Ratgeber auf zipperwalls.de/wissen","linkedin":"Logistik ist auf Messen oft der unterschätzte Kostenblock.\n\nTextile Messesysteme lassen sich zerlegt im PKW transportieren: Aluminiumrahmen in Tasche oder Trolley, Stoffdrucke gefaltet. Das spart Speditionskosten, Lagerfläche und feste Anlieferzeiten.\n\nWie ein kompletter Stand in einen Kombi passt, beschreibt unser Ratgeber: zipperwalls.de/wissen","hashtags":["#messetipp","#messelogistik","#messestand","#messebau","#zipperwalls"],"files":["KW 44/post-07-instagram-facebook.png","KW 44/post-07-linkedin.png"],"note":"Basis: Ratgeber 'Nie wieder Spedition' (19.03.2026).","status":"Entwurf"},{"nr":8,"kw":44,"date":"2026-10-29","day":"Do","pillar":"Service","topic":"Grafikservice: Keine Druckdaten? Wir gestalten.","format":"Bildpost 4:5","headline":"KEINE DRUCKDATEN? WIR GESTALTEN.","instagram":"Keine Druckdaten? Wir gestalten.\nUnser Grafikservice erstellt Ihr Layout oder passt vorhandene Daten an die Druckvorlage an. Damit Ihr Motiv auf dem Stoff genau so wirkt wie geplant.\nAnfragen an grafik@zipperwalls.de","facebook":"Die Messewand ist bestellt, aber die Druckdaten fehlen? Unser Grafikservice übernimmt das.\nWir gestalten Ihr Layout nach Ihren Vorgaben (45 € je halbe Stunde, netto) oder passen vorhandene Dateien an unsere Druckvorlage an (25 € je Datei, netto).\nKontakt: grafik@zipperwalls.de oder +49 7276 4049960","linkedin":"Der häufigste Engpass vor der Messe sind nicht die Systeme, sondern die Druckdaten.\n\nUnser Grafikservice übernimmt Layout und Datenprüfung: Gestaltung nach Ihren Vorgaben zu 45 € je halbe Stunde oder Anpassung vorhandener Daten an die Druckvorlage zu 25 € je Datei (jeweils netto).\n\nSo kommen Ihre Drucke rechtzeitig und passgenau. Kontakt: grafik@zipperwalls.de","hashtags":["#grafikservice","#druckdaten","#textildruck","#messestand","#zipperwalls"],"files":["KW 44/post-08-instagram-facebook.png","KW 44/post-08-linkedin.png"],"note":"Preise vor Post prüfen (Stand 08/2026: 45 €/halbe Std., 25 €/Datei).","status":"Entwurf"},{"nr":9,"kw":45,"date":"2026-11-03","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #04: Messestand mieten oder kaufen?","format":"Bildpost 4:5 oder Karussell","headline":"MIETEN ODER KAUFEN?","instagram":"Messe-Tipp #04: Mieten oder kaufen?\nWer regelmäßig ausstellt, fährt mit eigenem System oft günstiger. Für jede Kampagne tauschen Sie nur den Druck.\nDie ganze Rechnung im Ratgeber auf zipperwalls.de/wissen","facebook":"Messe-Tipp #04: Messestand mieten oder kaufen?\nDie Antwort hängt vor allem davon ab, wie oft Sie ausstellen. Bei mehreren Auftritten im Jahr lohnt sich ein eigenes System häufig, weil Sie nur noch die Drucke wechseln. Lager und Transport gehören aber in die Rechnung.\nUnser Ratgeber rechnet beide Varianten durch: zipperwalls.de/wissen","linkedin":"Mieten oder kaufen? Eine Frage, die wir in fast jeder Beratung hören.\n\nUnsere Faustregel: Je häufiger Sie ausstellen, desto eher lohnt sich ein eigenes System. Der Rahmen bleibt, nur der Druck wechselt mit der Kampagne. Fair gerechnet gehören Lagerung und Transport mit in den Vergleich.\n\nDie ausführliche Gegenüberstellung finden Sie in unserem Ratgeber: zipperwalls.de/wissen","hashtags":["#messetipp","#messeplanung","#messebudget","#messestand","#zipperwalls"],"files":["KW 45/post-09-instagram-facebook.png","KW 45/post-09-linkedin.png"],"note":"Faustregel 'wer oft ausstellt' , mit dem Ratgeber-Artikel abgleichen und ggf. anpassen.","status":"Entwurf"},{"nr":10,"kw":45,"date":"2026-11-05","day":"Do","pillar":"Produkte & Anwendung","topic":"Ersatzdrucke: neue Kampagne, gleiches System","format":"Bildpost 4:5 (Vorher/Nachher)","headline":"NEUE KAMPAGNE. GLEICHES SYSTEM.","instagram":"Neue Kampagne. Gleiches System.\nFür fast jede unserer Messewände und Theken gibt es passgenaue Ersatzdrucke. Rahmen behalten, Motiv tauschen, fertig.\nMehr im Shop auf zipperwalls.de","facebook":"Neues Logo, neue Produktlinie oder eine andere Messe? Sie brauchen keine neue Wand.\nFür nahezu alle unsere Systeme bieten wir passgenaue Ersatzdrucke an. Der Aluminiumrahmen bleibt, nur der Stoffbezug wird getauscht. Das spart Kosten und Lagerplatz.\nErsatzdrucke finden Sie direkt beim jeweiligen Produkt auf zipperwalls.de","linkedin":"Nachhaltigkeit im Messebau beginnt beim Rahmen, den man nicht wegwirft.\n\nUnsere textilen Systeme sind auf Wiederverwendung ausgelegt: Der Aluminiumrahmen bleibt über Jahre im Einsatz, für jede neue Kampagne wird nur der Stoffbezug getauscht. Gedruckt wird im Sublimationsverfahren ohne Lösungs- und Bindemittel.\n\nPassende Ersatzdrucke gibt es für nahezu alle Systeme im Shop: zipperwalls.de","hashtags":["#ersatzdruck","#textildruck","#messewand","#nachhaltigkeit","#zipperwalls"],"files":["KW 45/post-10-instagram-facebook.png","KW 45/post-10-linkedin.png"],"note":null,"status":"Entwurf"},{"nr":11,"kw":46,"date":"2026-11-10","day":"Di","pillar":"Saison","topic":"Weihnachtsmarkt und Winter-Events: Outdoor-Ausstattung","format":"Bildpost 4:5","headline":"BEREIT FÜR DEN WEIHNACHTSMARKT?","instagram":"Bereit für den Weihnachtsmarkt?\nFaltzelte, Beachflags und aufblasbare Zelte mit Ihrem Branding sorgen auch draußen für Sichtbarkeit. Planen Sie die Lieferzeit rechtzeitig ein.\nMehr im Shop auf zipperwalls.de","facebook":"Vereinsstand, Firmenaktion oder Stand auf dem Weihnachtsmarkt: Auch draußen soll Ihr Auftritt erkennbar sein.\nBedruckte Faltzelte, Beachflags und aufblasbare Zelte bringen Ihr Branding auf jede Fläche. Damit alles rechtzeitig vor Ort ist, empfehlen wir, jetzt zu bestellen.\nAlle Outdoor-Produkte auf zipperwalls.de","linkedin":"Die Wintersaison ist für viele Unternehmen, Kommunen und Vereine Hochsaison für Außenauftritte.\n\nFür Weihnachtsmärkte, Winterevents und Aktionstage führen wir bedruckte Faltzelte, Beachflags, Werbetore und aufblasbare Zelte. Alle Systeme sind für den schnellen Auf- und Abbau ausgelegt.\n\nWer im Dezember draußen sichtbar sein will, sollte die Lieferzeit jetzt einplanen: zipperwalls.de","hashtags":["#outdoorwerbung","#faltzelt","#beachflag","#eventausstattung","#zipperwalls"],"files":["KW 46/post-11-instagram-facebook.png","KW 46/post-11-linkedin.png"],"note":"Konkrete Lieferzeit für Outdoor-Produkte vor Post prüfen. FOTO fehlt: Shop-Bilder der Faltzelte zeigen das Lieferantenlogo, eigenes Foto oder neutrales Render nötig.","status":"Entwurf"},{"nr":12,"kw":46,"date":"2026-11-12","day":"Do","pillar":"Hinter den Kulissen","topic":"So entsteht Ihr Stoffdruck","format":"Bildpost 4:5 oder Reel","headline":"SO ENTSTEHT IHR STOFFDRUCK.","instagram":"So entsteht Ihr Stoffdruck.\nWir drucken im Sublimationsverfahren: Die Farbe geht in die Faser über, statt auf ihr zu liegen. Ergebnis: brillant, knitterarm und waschbar bei 30 °C.","facebook":"Wie kommt Ihr Motiv auf den Stoff?\nIm Sublimationsdruck wird die Farbe unter Hitze direkt in die Faser übertragen. Dadurch bleibt der Druck brillant, scheuert nicht ab und übersteht die Wäsche bei 30 °C. Der Stoff ist B1-zertifiziert, also für Messehallen zugelassen.\nFragen zum Druck? Wir beraten Sie gern.","linkedin":"Was hinter einem guten Messedruck steckt.\n\nWir drucken unsere Textilien im Sublimationsverfahren, ohne Lösungs- und Bindemittel. Die Farbe verbindet sich mit der Faser, statt eine Schicht zu bilden. Das sorgt für brillante Farben, knitterarme Oberflächen und Waschbarkeit bei 30 °C.\n\nDer Stretch-Display-Stoff ist B1-zertifiziert und damit für den Einsatz in Messehallen geeignet.","hashtags":["#textildruck","#sublimationsdruck","#messewand","#b1","#zipperwalls"],"files":["KW 46/post-12-instagram-facebook.png","KW 46/post-12-linkedin.png"],"note":"Prüfen, ob Fotos oder Videos vom Druckpartner genutzt werden dürfen.","status":"Entwurf"},{"nr":13,"kw":47,"date":"2026-11-17","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #05: Leadgenerierung auf der Messe","format":"Bildpost 4:5","headline":"KONTAKTE STATT VISITENKARTEN.","instagram":"Messe-Tipp #05: Kontakte statt Visitenkarten.\nEin Stapel Karten ist noch kein Ergebnis. Legen Sie Tagesziele fest, erfassen Sie Gespräche direkt am Stand und fassen Sie schnell nach.\nMehr im Ratgeber auf zipperwalls.de/wissen","facebook":"Messe-Tipp #05: Was nach der Messe zählt, sind qualifizierte Kontakte.\nDrei Gewohnheiten machen den Unterschied: ein klares Ziel pro Messetag, Gesprächsnotizen direkt am Stand und ein Nachfassen innerhalb von zwei Tagen.\nMehr dazu in unserem Ratgeber: zipperwalls.de/wissen","linkedin":"Der Erfolg einer Messe entscheidet sich nach der Messe.\n\nDrei Punkte, die wir Ausstellern empfehlen:\n1. Ein messbares Ziel pro Messetag festlegen.\n2. Gesprächsinhalte direkt am Stand erfassen, nicht abends aus dem Gedächtnis.\n3. Innerhalb von 48 Stunden nachfassen.\n\nAusführlich in unserem Ratgeber zur Leadgenerierung: zipperwalls.de/wissen","hashtags":["#messetipp","#leadgenerierung","#messemarketing","#b2bmarketing","#zipperwalls"],"files":["KW 47/post-13-instagram-facebook.png","KW 47/post-13-linkedin.png"],"note":"Basis: Ratgeber 'Leadgenerierung auf der Messe'.","status":"Entwurf"},{"nr":14,"kw":47,"date":"2026-11-19","day":"Do","pillar":"Produkte & Anwendung","topic":"Messestand-Sets: Wand und Theke als System","format":"Bildpost 4:5","headline":"WAND UND THEKE. EIN STAND.","instagram":"Wand und Theke. Ein Stand.\nUnsere Messestand-Sets kombinieren Rückwand und Theke im abgestimmten Design, inklusive Druck. Als Reihen-, Eck- oder Kopfstand.\nAlle Sets auf zipperwalls.de","facebook":"Sie möchten nicht jedes Teil einzeln zusammensuchen? Unsere Messestand-Sets bringen Rückwand und Theke im abgestimmten Design mit, inklusive Druck und meist mit LED-Counter.\nVom Eckstand mit 3 x 3 m bis zum Kopfstand mit Kabine.\nAlle Sets auf zipperwalls.de","linkedin":"Ein stimmiger Messestand entsteht aus aufeinander abgestimmten Elementen.\n\nUnsere Messestand-Sets kombinieren Messewand und Theke in einem Design, inklusive Druck. Erhältlich als Reihen-, Eck- oder Kopfstand, von kompakten 3 x 3 m bis zu großen Flächen mit Kabine.\n\nDer Vorteil: eine Bestellung, ein Druckdatensatz, ein durchgängiges Erscheinungsbild. Übersicht auf zipperwalls.de","hashtags":["#messestand","#messebau","#messetheke","#standbau","#zipperwalls"],"files":["KW 47/post-14-instagram-facebook.png","KW 47/post-14-linkedin.png"],"note":null,"status":"Entwurf"},{"nr":15,"kw":48,"date":"2026-11-24","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #06: Das Klick-Prinzip, Aufbau in Minuten","format":"Reel (15 bis 30 s) + Bildpost","headline":"AUFBAU IN MINUTEN.","instagram":"Messe-Tipp #06: Aufbau in Minuten.\nRahmen stecken, Stoff überziehen, Reißverschluss zu. So einfach funktioniert das Klick-Prinzip unserer Messewände.\nMehr im Ratgeber auf zipperwalls.de/wissen","facebook":"Messe-Tipp #06: Wie lange dauert der Aufbau einer Messewand?\nMit dem Klick-Prinzip wenige Minuten: Aluminiumrahmen zusammenstecken, Stoffbezug überziehen, Reißverschluss schließen, Füße montieren. Ohne Werkzeug, auch allein.\nSchritt für Schritt im Ratgeber: zipperwalls.de/wissen","linkedi rf"},{"nr":17,"kw":49,"date":"2026-12-01","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #07: Hausmesse im Januar planen","format":"Bildpost 4:5 oder Karussell","headline":"HAUSMESSE IM JANUAR?","instagram":"Messe-Tipp #07: Hausmesse im Januar?\nMit Messewänden gliedern Sie eigene Räume in Themeninseln und schaffen Messeatmosphäre im Unternehmen.\nMehr im Ratgeber auf zipperwalls.de/wissen","facebook":"Messe-Tipp #07: Die Hausmesse als Jahresauftakt.\nViele Unternehmen laden im Januar Kunden ins eigene Haus ein. Mit Messewänden und Theken gliedern Sie Lager, Showroom oder Kantine in klare Themeninseln. Termin und Einladungen sollten jetzt stehen.\nCheckliste im Ratgeber: zipperwalls.de/wissen","linkedin":"Die Hausmesse ist für viele Mittelständler der wichtigste Kundentermin im Jahr.\n\nWer im Januar einlädt, sollte Termin und Einladungen jetzt festlegen. Mit mobilen Messewänden und Theken lassen sich eigene Räume in Themeninseln gliedern, ohne bauliche Veränderung, und die Ausstattung ist im nächsten Jahr wieder einsatzbereit.\n\nUnser Ratgeber zur Hausmesse: zipperwalls.de/wissen","hashtags":["#hausmesse","#messetipp","#eventplanung","#messewand","#zipperwalls"],"files":["KW 49/post-17-instagram-facebook.png","KW 49/post-17-linkedin.png"],"note":"Basis: Ratgeber 'Hausmesse planen'.","status":"Entwurf"},{"nr":18,"kw":49,"date":"2026-12-03","day":"Do","pillar":"Kundenstimmen","topic":"Kundenstimme: Service, Abwicklung, Qualität","format":"Bildpost 4:5","headline":"Top-Kundenservice, reibungslose Abwicklung, Top-Qualität der Artikel.","instagram":"Service, Abwicklung, Qualität. Drei Punkte, an denen wir uns jeden Tag messen lassen.\nDanke für diese Bewertung.","facebook":"\"Top-Kundenservice, reibungslose Abwicklung, Top-Qualität der Artikel.\"\nDanke für dieses Feedback. Genau diese drei Punkte sind uns wichtig: erreichbar sein, zuverlässig liefern und Produkte anbieten, die viele Messen halten.\nAlle Bewertungen finden Sie bei Trusted Shops.","linkedin":"Drei Punkte, die Kunden in unseren Bewertungen immer wieder nennen: Service, Abwicklung und Qualität.\n\nDiese Bewertung fasst es kurz zusammen. Für uns ist sie Bestätigung und Anspruch zugleich, gerade in der Hochphase vor den Frühjahrsmessen.\n\nAktuell 4,77 von 5 in verifizierten Bewertungen bei Trusted Shops.","hashtags":["#kundenstimme","#kundenservice","#messestand","#zipperwalls"],"files":["KW 49/post-18-instagram-facebook.png","KW 49/post-18-linkedin.png"],"note":"Trusted-Shops-Nutzungsbedingungen prüfen (siehe Post 4).","status":"Entwurf"},{"nr":19,"kw":50,"date":"2026-12-08","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #08: Kleiner Stand, große Wirkung (6 bis 10 m²)","format":"Bildpost 4:5","headline":"KLEINER STAND, GROSSE WIRKUNG.","instagram":"Messe-Tipp #08: Kleiner Stand, große Wirkung.\nAuf 6 bis 10 m² zählt jede Entscheidung. Ein starkes Motiv auf der Rückwand, eine Theke vorn und freie Fläche für Gespräche.\nMehr im Ratgeber auf zipperwalls.de/wissen","facebook":"Messe-Tipp #08: Auch auf wenigen Quadratmetern auffallen.\nBei kleinen Ständen von 6 bis 10 m² wirkt eine großflächige Rückwand mit einem einzigen, klaren Motiv. Die Theke gehört nach vorn, damit dahinter Raum für Gespräche bleibt, und die Höhe sollte voll genutzt werden.\nBeispiele im Ratgeber: zipperwalls.de/wissen","linkedin":"Kleiner Stand, große Wirkung: Auf 6 bis 10 m² entscheidet die Reduktion.\n\nUnsere Empfehlungen aus vielen Projekten: Eine Rückwand mit nur einem Motiv und einer Botschaft. Die Theke an der Gangkante. Die verfügbare Höhe ausnutzen, damit der Stand schon von weitem erkennbar ist.\n\nPraxisbeispiele in unserem Ratgeber: zipperwalls.de/wissen","hashtags":["#messetipp","#messestand","#messedesign","#standbau","#zipperwalls"],"files":["KW 50/post-19-instagram-facebook.png","KW 50/post-19-linkedin.png"],"note":"Basis: Ratgeber 'Kleiner Messestand, große Wirkung'.","status":"Entwurf"},{"nr":20,"kw":50,"date":"2026-12-10","day":"Do","pillar":"Service","topic":"Bestellschl anuar bis März im Herbst entschieden werden und was Sie jetzt erledigen sollten.","text":"Guten Tag,\n\nab sofort erhalten Sie von uns jede Woche einen kurzen Newsletter mit Praxiswissen rund um Ihren Messeauftritt: Tipps zur Planung, Neuigkeiten aus dem Sortiment und Termine, die Sie kennen sollten. Kurz, sachlich und ohne Werbeflut.\n\nDen Anfang macht ein Thema, das viele Aussteller erst im Dezember bemerken: Die Frühjahrsmessen 2027 entscheiden sich jetzt.\n\nMESSE-TIPP #01: DREI SCHRITTE BIS JAHRESENDE\n\n1. Standmaße und Standart klären. Ob Reihen-, Eck- oder Kopfstand bestimmt, welche Seiten sichtbar sind und wie viele Wände und Theken Sie brauchen. Erst mit verbindlichen Maßen lässt sich die Ausstattung sinnvoll planen.\n\n2. Druckdaten mit Vorlauf anlegen. Planen Sie mindestens eine Korrekturschleife ein. Die Produktionszeit beginnt erst, wenn druckfähige Daten vorliegen und der Korrekturabzug freigegeben ist.\n\n3. Lieferzeit und Probeaufbau einplanen. Bauen Sie Ihren Stand einmal im eigenen Haus auf. So sehen Sie das Motiv in Originalgröße und wissen am Messetag, welcher Handgriff wohin gehört.\n\nWer diese drei Punkte bis Jahresende abhakt, startet entspannt in die Messesaison. Wenn Sie bei Größe, System oder Gestaltung unsicher sind, beraten wir Sie gern persönlich.\n\nViele Grüße aus Herxheim\nIhr Team von Zipperwalls\n\nTelefon +49 7276 4049970 (Montag bis Freitag, 8 bis 17 Uhr)\nkontakt@zipperwalls.de | www.zipperwalls.de","button_text":"Messestände ansehen","button_link":"https://www.zipperwalls.de/messestaende/","extra_title":"Nächste Woche im Newsletter","extra_text":"Fernwirkung: So gestalten Sie Ihre Messewand, damit Besucher Ihre Botschaft schon aus zehn Metern verstehen.","extra_link":null,"image_idea":"Grafik aus Post 02 (Social_Media/2026/KW 41/post-02-instagram-facebook.png) oder Produktbild eines Messestand-Sets.","note":"Erste Ausgabe nach langer Pause: Vor dem Versand Empfängerliste in MailPoet prüfen (nur Abonnenten mit Einwilligung).","status":"Entwurf","open_rate":null,"click_rate":null,"unsubscribes":null},{"nr":2,"kw":42,"date":"2026-10-13","day":"Dienstag","time":"09:00","type":"eigenständig","social":"kein direkter Bezug (Zusatzblock zu Post 25: Hinter den Kulissen, Bestellablauf)","rubric":"Gestaltung","topic":"Fernwirkung: So gestalten Sie eine Messewand, die aus zehn Metern wirkt","subject":"Fernwirkung: Fünf Regeln für Ihre Messewand","subject_alt":"Wirkt Ihre Messewand auch aus zehn Metern?","preview":"Besucher entscheiden in Sekunden. So gestalten Sie ein Motiv, das im Gang auffällt und sofort verstanden wird.","text":"Guten Tag,\n\nBesucher entscheiden im Vorbeigehen, ob sie stehen bleiben. Ihre Messewand hat dafür nur wenige Sekunden, und das oft aus mehreren Metern Entfernung. Mit diesen fünf Regeln wirkt Ihr Motiv auch aus zehn Metern.\n\nFÜNF REGELN FÜR FERNWIRKUNG\n\n1. Eine Wand, eine Botschaft. Formulieren Sie eine Kernaussage in wenigen Worten, die sofort klar macht, was Sie anbieten. Details gehören in das Gespräch oder auf den Flyer, nicht auf die Rückwand.\nTipp: Testen Sie die Aussage am Kollegen. Versteht er in drei Sekunden, worum es geht, passt sie.\n\n2. Wichtiges nach oben. Logo und Kernaussage gehören in den oberen Bereich der Wand. Theke, Möbel und Besucher verdecken den unteren Teil fast immer.\nTipp: Lassen Sie im unteren Bereich Platz für Bildfläche statt Text.\n\n3. Groß und klar schreiben. Wählen Sie eine gut lesbare Schrift ohne Verzierungen und eine Schriftgröße, die auch aus der Entfernung lesbar ist. Lieber weniger Text, dafür größer.\nTipp: Drucken Sie den Entwurf auf A4 aus und betrachten Sie ihn aus drei Metern. Was dort schwer lesbar ist, ist es auf der Messe auch.\n\n4. Starker Kontrast. Dunkle Schrift auf hellem Grund oder helle Schrift auf dunklem Grund. Text direkt auf unruhigen Fotos geht in der Halle unter.\n\n5. Ein großes Bild statt vieler kleiner. Ein starkes Motiv zieht mehr Blicke an als eine Collage. Achten Sie auf mindestens 120 dpi in Endgröße, damit nichts unscharf wirkt.\n\nWenn Sie bei der Gestaltung Unterstützung möchten, übernimmt unser Grafikservice Layout und Datenprüfung.\n\nViele Grüße\nIhr Team von Zipperwalls","button_text":"Zum Grafikservice","button_link":"https://www.zipperwalls.de/grafikservice/","extra_title":"Heute auf unseren Kanälen","extra_text":"Von der Idee zur fertigen Messewand: wie eine Bestellung bei uns abläuft.","extra_link":null,"image_idea":"Produktfoto einer bedruckten Messewand mit klarem, großem Motiv aus dem Shop.","note":"Thema am 04.10.2026 geändert (Wunsch Bela/Darien): kein Messekalender, kein Bestellablauf. Eigenständige Ausgabe zur Gestaltung.","status":"Entwurf","open_rate":null,"click_rate":null,"unsubscribes":null},{"nr":3,"kw":43,"date":"2026-10-20","day":"Dienstag","time":"09:00","type":"gekoppelt","social":"Post 05: Messe-Tipp #02 Der Motten-Effekt","rubric":"Ratgeber","topic":"Messe-Tipp #02: Der Motten-Effekt, warum Licht Besucher anzieht","subject":"Der Motten-Effekt: Warum Licht Besucher anzieht","subject_alt":"Messe-Tipp #02: So wird Ihr Stand im Gang gesehen","preview":"In gleichmäßig ausgeleuchteten Hallen fällt auf, was selbst leuchtet. So nutzen Sie den Effekt für Ihren Stand.","text":"Guten Tag,\n\nMessehallen sind hell, gleichmäßig ausgeleuchtet und voller Reize. Besucher entscheiden in wenigen Sekunden, wo sie stehen bleiben. Was dabei zuverlässig Aufmerksamkeit bekommt: Flächen, die selbst leuchten.\n\nMESSE-TIPP #02: DER MOTTEN-EFFEKT\n\nWir nennen das den Motten-Effekt. Eine hinterleuchtete Rückwand setzt sich von der Umgebung ab, wirkt hochwertig und ist schon aus dem Gang erkennbar. Drei Punkte, auf die es ankommt:\n\n1. Gleichmäßige Ausleuchtung. Gute LED-Textilwände leuchten die ganze Fläche aus, ohne helle Flecken und ohne zu blenden.\n\n2. Ein klares Motiv. Licht verstärkt, was zu sehen ist. Eine Botschaft und ein starkes Bild wirken besser als viele Details.\n\n3. Die richtige Position. Die leuchtende Fläche gehört dorthin, wo sie vom Hauptgang aus gesehen wird, meist an die Rückwand oder als Blickfang an die Standecke.\n\nUnser Ratgeber zeigt ausführlicher, wie Sie Licht gezielt einsetzen und welche Systeme sich für welche Standgröße eignen.\n\nViele Grüße aus Herxheim\nIhr Team von Zipperwalls\n\nTelefon +49 7276 4049970 (Montag bis Freitag, 8 bis 17 Uhr)\nkontakt@zipperwalls.de | www.zipperwalls.de","button_text":"Zum Ratgeber Motten-Effekt","button_link":"https://www.zipperwalls.de/wissen/ratgeber/messestand-besucher-anziehen-motten-effekt/","extra_title":"Am Donnerstag auf unseren Kanälen: LED-Messewände und PIXLIP GO","extra_text":"Modulare Lightbox-Systeme verbinden gleichmäßige Hinterleuchtung mit werkzeuglosem Aufbau. Einzelne Module lassen sich zu größeren Wänden kombinieren und für den nächsten Auftritt neu bespannen.","extra_link":"https://www.zipperwalls.de/messewaende/led-messewaende/","image_idea":"Grafik aus Post 05 (KW 43) oder Produktbild einer LED-Messewand von zipperwalls.de.","note":null,"status":"Entwurf","open_rate":null,"click_rate":null,"unsubscribes":null},{"nr":4,"kw":44,"date":"2026-10-29","day":"Donnerstag","time":"09:00","type":"gekoppelt","social":"Post 08: Grafikservice (Zusatzblock zu Post 07: Messe-Tipp #03)","rubric":"Service","topic":"Druckdaten richtig anlegen: 6 Punkte vor dem Upload + Grafikservice","subject":"Druckdaten ohne Rückfragen: 6 Punkte vor dem Upload","subject_alt":"So kommen Ihre Druckdaten beim ersten Mal durch","preview":"Der häufigste Engpass vor der Messe sind die Druckdaten. Mit dieser Liste sparen Sie Korrekturschleifen.","text":"Guten Tag,\n\naus der Praxis wissen wir: Vor der Messe wird selten das System knapp, sondern die Zeit für die Druckdaten. Jede Rückfrage kostet Tage. Mit diesen sechs Punkten kommen Ihre Daten beim ersten Mal durch.\n\n1. Erst bestellen, dann Daten senden. Geben Sie bei jeder Datenlieferung Ihre Bestellnummer an, damit wir die Dateien eindeutig zuordnen können.\n\n2. Die passende Druckvorlage verwenden. Auf jeder Produktseite finden Sie unter \"Druckvorlagen\" das Datenblatt mit Endformat und allen Maßen.\n\n3. Im Farbmodus CMYK anlegen. RGB-Daten werden automatisch umgewandelt, dabei kann es zu Farbverschiebungen kommen.\n\n4. Auf die Bildauflösung achten. Bilder sollten in Endgröße mindestens 120 dpi haben. Ist die Auflösung zu gering, melden wir uns vor dem Druck bei Ihnen.\n\n5. Schriften in Pfade umwandeln und keine Word- oder PowerPoint-Dateien senden. Diese Formate sind für den Druck nicht geeignet.\n\n6. Den Korrekturabzug zügig freigeben. Sie erhalten von uns ein Ansichts-PDF. Erst mit Ihrer schriftlichen Freigabe beginnt die Produktion.\n\nGroße Dateien senden Sie am einfachsten über zipperwalls.wetransfer.com, kleinere per E-Mail an daten@zipperwalls.de (bis 25 MB).\n\nKEINE DRUCKDATEN ODER KEINE ZEIT?\n\nUnser Grafikservice gestaltet Ihr Layout nach Ihren Vorgaben (45 € je halbe Stunde) oder passt vorhandene Daten an die Druckvorlage an (25 € je Datei, jeweils zzgl. MwSt.).\n\nViele Grüße aus Herxheim\nIhr Team von Zipperwalls\n\nTelefon +49 7276 4049970 (Montag bis Freitag, 8 bis 17 Uhr)\nkontakt@zipperwalls.de | www.zipperwalls.de","button_text":"Zum Grafikservice","button_link":"https://www.zipperwalls.de/grafikservice/","extra_title":"Messe-Tipp #03 dieser Woche: der komplette Stand im PKW","extra_text":"Textile Messesysteme lassen sich zerlegt im Kombi transportieren: Rahmen in Tasche oder Trolley, Drucke gefaltet. Das spart Spedition, Lagerfläche und feste Anlieferzeiten.","extra_link":"https://www.zipperwalls.de/wissen/ratgeber/messestand-transportieren-logistik-kosten-senken/","image_idea":"Grafik aus Post 08 (KW 44) oder Ausschnitt einer Druckvorlage (Datenblatt) aus dem Shop.","note":"Grafikservice-Preise prüfen (Stand 08/2026). 120 dpi und Schriften in Pfade sind interne Preflight-Vorgaben, vor Versand bestätigen. Druckdaten-Upload im Checkout noch nicht live, deshalb nicht erwähnt.","status":"Entwurf","open_rate":null,"click_rate":null,"unsubscribes":null},{"nr":5,"kw":45,"date":"2026-11-03","day":"Dienstag","time":"09:00","type":"gekoppelt","social":"Post 09: Messe-Tipp #04 Mieten oder kaufen?","rubric":"Ratgeber","topic":"Messe-Tipp #04: Messestand mieten oder kaufen?","subject":"Messestand mieten oder kaufen? Unsere Faustregel","subject_alt":"Messe-Tipp #04: Ab wann sich ein eigenes System lohnt","preview":"Eine Frage aus fast jeder Beratung. Diese vier Punkte gehören in einen fairen Vergleich.","text":"Guten Tag,\n\nmieten oder kaufen? Diese Frage hören wir in fast jeder Beratung. Eine pauschale Antwort gibt es nicht, aber eine einfache Faustregel: Je häufiger Sie ausstellen, desto eher lohnt sich ein eigenes System.\n\nMESSE-TIPP #04: VIER PUNKTE FÜR DEN VERGLEICH\n\n1. Anzahl der Einsätze. Rechnen Sie nicht nur die nächste Messe, sondern alle Termine der kommenden zwei bis drei Jahre, inklusive Hausmessen, Kundenevents und Showroom.\n\n2. Laufende Kosten. Zur Miete kommen meist Transport sowie Auf- und Abbau. Beim Kauf gehören Lagerung und Transport fair mit in die Rechnung.\n\n3. Flexibilität. Bei textilen Systemen bleibt der Aluminiumrahmen, nur der Stoffdruck wechselt. Eine neue Kampagne kostet dann einen Ersatzdruck, keinen neuen Stand.\n\n4. Verfügbarkeit. Ein eigenes System steht jederzeit bereit, auch für einen kurzfristigen Zusatztermin.\n\nDie ausführliche Gegenüberstellung finden Sie in unserem Ratgeber.\n\nViele Grüße aus Herxheim\nIhr Team von Zipperwalls\n\nTelefon +49 7276 4049970 (Montag bis Freitag, 8 bis 17 Uhr)\nkontakt@zipperwalls.de | www.zipperwalls.de","button_text":"Zum Ratgeber Mieten oder kaufen","button_link":"https://www.zipperwalls.de/wissen/ratgeber/messestand-mieten-oder-kaufen-vergleich/","extra_title":"Am Donnerstag auf unseren Kanälen: Ersatzdrucke","extra_text":"Neue Kampagne, gleiches System: Passende Ersatzdrucke gibt es für nahezu alle Systeme im Shop. Gedruckt wird im Sublimationsverfahren ohne Lösungs- und Bindemittel.","extra_link":"https://www.zipperwalls.de/messewaende/ersatzdrucke/","image_idea":"Grafik aus Post 09 (KW 45).","note":"Keine steuerlichen Aussagen (Abschreibung o.ä.). Faustregel mit dem Ratgeber-Artikel abgleichen.","status":"Entwurf","open_rate":null,"click_rate":null,"unsubscribes":null},{"nr":6,"kw":46,"date":"2026-11-12","day":"Donnerstag","time":"09:00","type":"gekoppelt","social":"Post 12: So entsteht Ihr Stoffdruck (Zusatzblock zu Post 11: Outdoor im Winter)","rubric":"Hinter den Kulissen","topic":"So entsteht Ihr Stoffdruck + Pflege und Lagerung nach der Messesaison","subject":"Nach der Messe: So bleibt Ihr Stoffdruck wie neu","subject_alt":"Wie Ihr Messedruck entsteht und wie Sie ihn pflegen","preview":"Ein Blick auf den Sublimationsdruck und fünf Handgriffe für Pflege und Lagerung nach der Saison.","text":"Guten Tag,\n\ndie Herbstmessen sind vorbei, viele Messestände wandern jetzt ins Lager. Ein guter Moment für einen Blick darauf, wie Ihr Stoffdruck entsteht und wie er lange gut aussieht.\n\nSO ENTSTEHT IHR DRUCK\n\nWir drucken unsere Textilien im Sublimationsverfahren, ohne Lösungs- und Bindemittel. Die Farbe verbindet sich dabei mit der Faser, statt als Schicht auf dem Stoff zu liegen. Das Ergebnis sind brillante Farben und eine knitterarme Oberfläche, die bei 30 °C waschbar ist. Der Stretch-Display-Stoff ist B1-zertifiziert und damit für den Einsatz in Messehallen geeignet.\n\nFÜNF HANDGRIFFE NACH DER MESSE\n\n1. Stoffbezug abnehmen und auf Flecken prüfen. Bei Bedarf bei 30 °C waschen und die Pflegehinweise zum Produkt beachten.\n\n2. Den Druck vollständig trocknen lassen, bevor er eingepackt wird.\n\n3. Rahmenteile auf Vollständigkeit prüfen und Fehlendes gleich nachbestellen, nicht erst kurz vor der nächsten Messe.\n\n4. Den Druck locker gefaltet in der Tasche lagern, trocken und nicht unter schweren Gegenständen.\n\n5. Notieren, was beim letzten Aufbau gefehlt hat, vom Verlängerungskabel bis zum Prospektständer.\n\nUnd wenn Ihr Motiv nicht mehr aktuell ist: Tauschen Sie einfach den Druck. Der Rahmen bleibt.\n\nViele Grüße aus Herxheim\nIhr Team von Zipperwalls\n\nTelefon +49 7276 4049970 (Montag bis Freitag, 8 bis 17 Uhr)\nkontakt@zipperwalls.de | www.zipperwalls.de","button_text":"Ersatzdrucke ansehen","button_link":"https://www.zipperwalls.de/messewaende/ersatzdrucke/","extra_title":"Diese Woche auf unseren Kanälen: Outdoor im Winter","extra_text":"Für Weihnachtsmärkte, Winterevents und Aktionstage führen wir bedruckte Faltzelte, Beachflags, Werbetore und aufblasbare Zelte. Wer im Dezember draußen sichtbar sein will, sollte die Lieferzeit jetzt einplanen.","extra_link":"https://www.zipperwalls.de/outdoor/","image_idea":"Grafik aus Post 12 (KW 46); falls vorhanden eigenes Foto vom Druck oder vom Lager.","note":"Pflegehinweise (Waschen, Trocknen, Lagerung) mit Herstellerangaben abgleichen. Pflegeteil ist eigenständiger Inhalt, nicht auf Social Media.","status":"Entwurf","open_rate":null,"click_rate":null,"unsubscribes":null},{"nr":7,"kw":47,"date":"2026-11-17","day":"Dienstag","time":"09:00","type":"gekoppelt","social":"Post 13: Messe-Tipp #05 Leadgenerierung","rubric":"Ratgeber","topic":"Messe-Tipp #05: Leadgenerierung, drei Regeln fürs Nachfassen","subject":"Messe vorbei, Kontakte gesichert? 3 Regeln fürs Nachfassen","subject_alt":"Messe-Tipp #05: Aus Gesprächen werden Kunden","preview":"Der Erfolg einer Messe entscheidet sich danach. So machen Sie aus Gesprächen verwertbare Kontakte.","text":"Guten Tag,\n\nein voller Stand ist ein gutes Gefühl. Ob sich die Messe gelohnt hat, zeigt sich aber erst in den Wochen danach. Drei Regeln, die wir Ausstellern empfehlen:\n\nMESSE-TIPP #05: LEADGENERIERUNG, DIE NACH DER MESSE ZÄHLT\n\n1. Ein messbares Ziel pro Messetag. Zum Beispiel eine bestimmte Zahl qualifizierter Gespräche oder vereinbarter Folgetermine. So weiß das Standteam, worauf es ankommt.\n\n2. Gesprächsinhalte direkt am Stand erfassen. Name, Bedarf, nächster Schritt, Zeitrahmen. Was abends aus dem Gedächtnis notiert wird, ist meist unvollständig.\n\n3. Innerhalb von 48 Stunden nachfassen. Eine persönliche E-Mail mit Bezug auf das Gespräch wirkt mehr als ein allgemeines Rundschreiben Wochen später.\n\nEin Tipp aus der Praxis: Planen Sie am Stand einen ruhigen Platz für Gespräche ein, etwa eine Theke mit Ablage. Wer Platz zum Notieren hat, notiert auch.\n\nMehr zu Zielen, Gesprächsführung und Nachbereitung lesen Sie in unserem Ratgeber.\n\nViele Grüße aus Herxheim\nIhr Team von Zipperwalls\n\nTelefon +49 7276 4049970 (Montag bis Freitag, 8 bis 17 Uhr)\nkontakt@zipperwalls.de | www.zipperwalls.de","button_text":"Zum Ratgeber Leadgenerierung","button_link":"https://www.zipperwalls.de/wissen/ratgeber/leadgenerierung-auf-der-messe/","extra_title":"Am Donnerstag auf unseren Kanälen: Messestand-Sets","extra_text":"Unsere Sets kombinieren Messewand und Theke in einem Design, inklusive Druck. Erhältlich als Reihen-, Eck- oder Kopfstand, von kompakten 3 x 3 m bis zu großen Flächen mit Kabine.","extra_link":"https://www.zipperwalls.de/messestaende/","image_idea":"Grafik aus Post 13 (KW 47).","note":null,"status":"Entwurf","open_rate":null,"click_rate":null,"unsubscribes":null},{"nr":8,"kw":48,"date":"2026-11-26","day":"Donnerstag","time":"09:00","type":"gekoppelt","social":"Post 16: Jahresende, Messejahr 2027 einplanen (Zusatzblock zu Post 15: Messe-Tipp #06)","rubric":"Saison","topic":"Jahresende: Messejahr 2027 planen, Ausstattung für mehrere Saisons","subject":"Messejahr 2027: Jetzt planen, entspannt starten","subject_alt":"Ihr Messebudget 2027 sinnvoll einsetzen","preview":"Viele Unternehmen planen jetzt das Marketingbudget für 2027. So wird daraus eine Ausstattung für mehrere Saisons.","text":"Guten Tag,\n\nzum Jahresende planen viele Unternehmen ihr Marketingbudget für das kommende Jahr. Wenn Messen dazugehören, lohnt sich ein Blick über die nächste Veranstaltung hinaus.\n\nEINE INVESTITION ÜBER MEHRERE SAISONS\n\nAluminiumrahmen und Theken bleiben über Jahre im Einsatz, nur die Drucke wechseln mit der Kampagne. Wer in ein durchdachtes System investiert, plant damit nicht eine Messe, sondern ein ganzes Messejahr.\n\nDREI FRAGEN FÜR IHRE PLANUNG\n\n1. Welche Termine stehen 2027 fest, und welche kommen erfahrungsgemäß kurzfristig dazu?\n\n2. Welche Standgrößen brauchen Sie? Modulare Systeme lassen sich für kleine und große Flächen kombinieren.\n\n3. Was ist schon vorhanden? Bestehende Rahmen bekommen mit einem Ersatzdruck ein neues Gesicht.\n\nWer jetzt bestellt, startet mit fertiger Ausstattung in die Frühjahrsmessen 2027. Gern stellen wir Ihnen ein Paket für Ihr Messejahr zusammen, abgestimmt auf Ihre Termine und Flächen.\n\nViele Grüße aus Herxheim\nIhr Team von Zipperwalls\n\nTelefon +49 7276 4049970 (Montag bis Freitag, 8 bis 17 Uhr)\nkontakt@zipperwalls.de | www.zipperwalls.de","button_text":"Beratung anfragen","button_link":"https://www.zipperwalls.de/kontakt/","extra_title":"Messe-Tipp #06 dieser Woche: das Klick-Prinzip","extra_text":"Rahmen zusammenstecken, Stoffbezug überziehen, Reißverschluss schließen, Füße montieren. Vier Schritte, kein Werkzeug, kein Messebauer.","extra_link":"https://www.zipperwalls.de/wissen/ratgeber/messestand-schnell-aufbauen-ohne-werkzeug/","image_idea":"Grafik aus Post 16 (KW 48).","note":"Keine steuerlichen Aussagen. Black Friday (27.11.) bewusst nicht bespielt, kein Rabatt-Ton.","status":"Entwurf","open_rate":null,"click_rate":null,"unsubscribes":null},{"nr":9,"kw":49,"date":"2026-12-01","day":"Dienstag","time":"09:00","type":"gekoppelt","social":"Post 17: Messe-Tipp #07 Hausmesse im Januar","rubric":"Ratgeber","topic":"Messe-Tipp #07: Hausmesse im Januar planen","subject":"Hausmesse im Januar? Jetzt Termin und Einladung festlegen","subject_alt":"Messe-Tipp #07: Ihre eigene Messe im eigenen Haus","preview":"Für viele Mittelständler der wichtigste Kundentermin des Jahres. So gelingt die Hausmesse mit wenig Aufwand.","text":"Guten Tag,\n\ndie Hausmesse ist für viele Mittelständler der wichtigste Kundentermin im Jahr. Sie bestimmen Termin, Gästeliste und Atmosphäre, und Ihre Kunden erleben Ihr Unternehmen dort, wo es arbeitet.\n\nMESSE-TIPP #07: HAUSMESSE IM JANUAR PLANEN\n\n1. Termin und Einladungen jetzt festlegen. Im Dezember sind die Kalender Ihrer Kunden voll. Eine Einladung mit Vorlauf und eine Erinnerung im Januar sichern die Teilnahme.\n\n2. Räume in Themeninseln gliedern. Mit mobilen Messewänden und Theken entstehen in Halle, Werkstatt oder Foyer klar getrennte Bereiche, ganz ohne bauliche Veränderung.\n\n3. Wege planen. Begrüßung, Beschilderung, Stationen: Ihre Gäste sollen sich ohne Erklärung zurechtfinden.\n\n4. Die Ausstattung weiter nutzen. Was im Januar Ihre Hausmesse gliedert, steht danach im Empfang, im Showroom oder auf der nächsten Fachmesse.\n\nWeitere Tipps zu Planung, Ablauf und Nachbereitung finden Sie in unserem Ratgeber.\n\nViele Grüße aus Herxheim\nIhr Team von Zipperwalls\n\nTelefon +49 7276 4049970 (Montag bis Freitag, 8 bis 17 Uhr)\nkontakt@zipperwalls.de | www.zipperwalls.de","button_text":"Zum Ratgeber Hausmesse","button_link":"https://www.zipperwalls.de/wissen/ratgeber/hausmesse-planen/","extra_title":"Auf der Suche nach Ideen? Messestand-Ideen aus der Praxis","extra_text":"In unserem Ratgeber haben wir Beispiele und Anregungen für unterschiedliche Standgrößen zusammengestellt, vom kompakten Reihenstand bis zur großen Fläche.","extra_link":"https://www.zipperwalls.de/wissen/ratgeber/messestand-ideen/","image_idea":"Grafik aus Post 17 (KW 49).","note":"Kundenstimme (Post 18, Do 03.12.) bewusst nicht im Newsletter, solange die Trusted-Shops-Bedingungen für Zitate nicht geprüft sind.","status":"Entwurf","open_rate":null,"click_rate":null,"unsubscribes":null},{"nr":10,"kw":50,"date":"2026-12-10","day":"Donnerstag","time":"09:00","type":"gekoppelt","social":"Post 20: Bestellschluss vor Weihnachten (dazu Post 19: Messe-Tipp #08)","rubric":"Service","topic":"Bestellschluss vor Weihnachten + Messe-Tipp #08: Kleiner Stand, große Wirkung","subject":"Wichtig für Januar-Messen: Bestells  Fahrplan für das Messejahr 2027","subject_alt":"Vier Etappen bis zur nächsten Messe","preview":"Von der Flächenbuchung bis zum Probeaufbau: So bleibt vor jeder Messe Zeit für das Wesentliche.","text":"Guten Tag,\n\nzum Abschluss des Jahres ein einfacher Fahrplan, mit dem Sie jede Messe 2027 planen können. Rechnen Sie dafür vom Messetermin rückwärts.\n\nJETZT: Messen auswählen und Flächen buchen. Gute Standplätze sind früh vergeben.\n\n12 WOCHEN VORHER: Standkonzept und Druckmotiv festlegen. Von wo aus wird Ihr Stand gesehen, und welche Botschaft soll hängen bleiben?\n\n6 WOCHEN VORHER: Bestellung aufgeben und Druckdaten liefern, inklusive Korrekturschleife.\n\n4 WOCHEN VORHER: Probeaufbau im eigenen Haus. So sehen Sie das Motiv in Originalgröße, und Ihr Team kennt jeden Handgriff.\n\nIN DER MESSEWOCHE: Material vollständig? Kontakterfassung vorbereitet? Termine zum Nachfassen im Kalender geblockt?\n\nSo bleibt vor Ort Zeit für das, was auf der Messe zählt: die Gespräche.\n\nAb Januar geht es hier mit neuen Messe-Tipps weiter. Wir freuen uns, wenn Sie dabei bleiben.\n\nViele Grüße aus Herxheim\nIhr Team von Zipperwalls\n\nTelefon +49 7276 4049970 (Montag bis Freitag, 8 bis 17 Uhr)\nkontakt@zipperwalls.de | www.zipperwalls.de","button_text":"Messe planen und beraten lassen","button_link":"https://www.zipperwalls.de/kontakt/","extra_title":"Zum Nachlesen: alle Ratgeber an einem Ort","extra_text":"Planung, Aufbau, Transport und Standgestaltung: Alle Artikel finden Sie gesammelt in unserem Wissensbereich.","extra_link":"https://www.zipperwalls.de/wissen/","image_idea":"Grafik aus Post 24 (KW 53).","note":"Versand zwischen den Jahren: geringere Öffnungsrate zu erwarten. Alternative: auf Di 05.01.2027 verschieben und im Q1-Plan berücksichtigen.","status":"Entwurf","open_rate":null,"click_rate":null,"unsubscribes":null}]};
