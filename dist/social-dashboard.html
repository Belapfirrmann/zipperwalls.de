<title>Zipperwalls Social Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,700;0,800;0,900;1,900&display=swap">
<style>
/* Layout: feste dunkle Seitenleiste, Arbeitsfläche mit Karten. Zipperwalls Brand Kit:
   Gelb + Dunkel auf viel Weiß, Barlow, nur zwei runde Ecken (oben links, unten rechts). */
:root {
  --gelb: #FFCC20; --gelb-dunkel: #EFB800; --auf-gelb: #1D1D1B;
  --side: #1F2725; --side-text: #FFFFFF; --side-hover: rgba(255,255,255,.08);
  --bg: #F5F5F5; --card: #FFFFFF; --text: #1D1D1B; --grau: #4B4F58; --grau-hell: #808285;
  --flaeche: #F2F5F7; --linie: #ECEEF0; --rahmen: #C9CCD0; --chip: #E4E6E8;
  --dark-btn: #1F2725; --dark-btn-text: #FFFFFF;
  --p0: #FFCC20; --p1: #1F2725; --p2: #808285; --p3: #EFB800; --p4: #4B4F58; --p5: #C9CCD0; --p6: #000000;
  --shadow: 0 0 7px rgba(0,0,0,.15);
  --r-klein: 8px; --r: 12px; --r-gross: 30px;
  --font: 'Barlow', 'Arial Narrow', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --side: #141A19; --side-hover: rgba(255,255,255,.06);
  --bg: #1F2725; --card: #283230; --text: #F2F5F7; --grau: #BFC4C9; --grau-hell: #8E9399;
  --flaeche: #313C3A; --linie: #3A4644; --rahmen: #4B5654; --chip: #3A4644;
  --dark-btn: #F2F5F7; --dark-btn-text: #1D1D1B;
  --p1: #F2F5F7; --p4: #8E9399; --p5: #4B5654; --p6: #BFC4C9;
  --shadow: 0 0 7px rgba(0,0,0,.4); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --side: #141A19; --side-hover: rgba(255,255,255,.06);
  --bg: #1F2725; --card: #283230; --text: #F2F5F7; --grau: #BFC4C9; --grau-hell: #8E9399;
  --flaeche: #313C3A; --linie: #3A4644; --rahmen: #4B5654; --chip: #3A4644;
  --dark-btn: #F2F5F7; --dark-btn-text: #1D1D1B;
  --p1: #F2F5F7; --p4: #8E9399; --p5: #4B5654; --p6: #BFC4C9;
  --shadow: 0 0 7px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--bg); font-size: 17px; line-height: 1.55; }
h1, h2, h3 { font-weight: 900; text-transform: uppercase; line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: 40px; font-style: italic; }
h2 { font-size: 24px; }
h3 { font-size: 18px; }
p { margin: 0 0 .6em; }
a { color: var(--text); text-decoration-color: var(--gelb-dunkel); text-decoration-thickness: 2px; text-underline-offset: 3px; }
code { font-size: 14px; background: var(--flaeche); padding: 1px 5px; }
.muted { color: var(--grau); }
.small { font-size: 15px; }
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-text); padding: 28px 20px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; gap: 32px; }
.logo { width: 150px; display: block; }
.logo svg { width: 100%; height: auto; display: block; }
nav { display: flex; flex-direction: column; gap: 4px; }
nav a { color: var(--side-text); text-decoration: none; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 14px; padding: 12px 14px; border-radius: var(--r-klein) 0 var(--r-klein) 0; display: flex; justify-content: space-between; align-items: center; }
nav a:hover { background: var(--side-hover); }
nav a.active { background: var(--gelb); color: var(--auf-gelb); }
.count { background: var(--gelb); color: var(--auf-gelb); border-radius: 50%; min-width: 24px; height: 24px; display: inline-grid; place-items: center; font-size: 13px; margin-left: 8px; }
nav a.active .count { background: var(--auf-gelb); color: var(--gelb); }
.who { margin-top: auto; font-size: 13px; color: #9AA0A6; }
main { padding: 36px 40px 80px; max-width: 1180px; width: 100%; min-width: 0; }
.head { margin-bottom: 28px; }
.head p { color: var(--grau); max-width: 65ch; margin-top: 10px; }
.card { background: var(--card); border-radius: var(--r-gross) 0 var(--r-gross) 0; box-shadow: var(--shadow); padding: 26px; min-width: 0; }
.grid { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); }
.section { margin-bottom: 36px; }
.section > h2 { margin-bottom: 14px; }
.label { font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--grau); }
.badge { display: inline-block; background: var(--gelb); color: var(--auf-gelb); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; padding: 4px 12px; border-radius: var(--r-klein) 0 var(--r-klein) 0; }
.badge.dark { background: var(--dark-btn); color: var(--dark-btn-text); }
.badge.grey { background: var(--chip); color: var(--grau); }
.badge.tiny { font-size: 10px; padding: 2px 8px; }
.btn { background: var(--gelb); color: var(--auf-gelb); border: 0; padding: 12px 22px; font: 700 16px var(--font); border-radius: var(--r) 0 var(--r) 0; cursor: pointer; text-decoration: none; display: inline-block; transition: background .2s; }
.btn:hover { background: var(--gelb-dunkel); }
.btn.dark { background: var(--dark-btn); color: var(--dark-btn-text); }
.btn.ghost { background: var(--flaeche); color: var(--text); }
.btn.ghost:hover { background: var(--chip); }
.btn.armed { outline: 3px solid var(--gelb-dunkel); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.statlist { margin-top: 10px; display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.pillars { display: flex; height: 44px; border-radius: var(--r) 0 var(--r) 0; overflow: hidden; margin: 14px 0 18px; }
.pillars div { display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #FFFFFF; }
.pillars .p0, .pillars .p3, .pillars .p5 { color: #1D1D1B; }
.p0 { background: var(--p0); } .p1 { background: var(--p1); } .p2 { background: var(--p2); } .p3 { background: var(--p3); }
.p4 { background: var(--p4); } .p5 { background: var(--p5); } .p6 { background: var(--p6); }
:root[data-theme="dark"] .pillars .p1, :root[data-theme="dark"] .pillars .p6 { color: #1D1D1B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pillars .p1, :root:not([data-theme="light"]) .pillars .p6 { color: #1D1D1B; } }
.b0 { border-color: var(--p0); } .b1 { border-color: var(--p1); } .b2 { border-color: var(--p2); } .b3 { border-color: var(--p3); }
.b4 { border-color: var(--p4); } .b5 { border-color: var(--p5); } .b6 { border-color: var(--p6); }
.swatch { width: 14px; height: 14px; flex: none; border-radius: 3px 0 3px 0; display: inline-block; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
.week div { text-align: center; padding: 10px 2px; border-radius: var(--r-klein) 0 var(--r-klein) 0; background: var(--flaeche); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--grau-hell); }
.week div.on { background: var(--gelb); color: var(--auf-gelb); }
.notice { border-left: 6px solid var(--gelb); background: var(--card); padding: 14px 18px; margin-bottom: 24px; box-shadow: var(--shadow); }
.pending { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-bottom: 16px; }
input[type=text], input[type=datetime-local], textarea { width: 100%; font: 400 16px var(--font); padding: 10px 12px; border: 1px solid var(--rahmen); border-radius: var(--r-klein) 0 var(--r-klein) 0; background: var(--card); color: var(--text); }
textarea { min-height: 220px; resize: vertical; }
input:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 3px solid var(--gelb-dunkel); outline-offset: 2px; }
.field { margin-bottom: 14px; }
.field > .label { display: block; margin-bottom: 6px; }
.post { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; margin-bottom: 20px; }
.post .img { width: 100%; max-width: 100%; object-fit: cover; background: var(--flaeche); border-radius: var(--r) 0 var(--r) 0; display: grid; place-items: center; color: var(--grau-hell); aspect-ratio: 4 / 5; }
.post .img.sq { aspect-ratio: 1; max-width: 160px; }
.counter { font-size: 13px; color: var(--grau); text-align: right; font-variant-numeric: tabular-nums; }
.counter.over { color: var(--text); font-weight: 800; }
.chan { display: flex; gap: 6px; align-items: center; font-weight: 700; }
.results { margin-top: 14px; display: grid; gap: 6px; font-size: 15px; }
.results .err, .open-point { background: var(--flaeche); border-left: 4px solid var(--text); padding: 8px 12px; font-size: 15px; }
.open-point { margin: 10px 0 0; }
details { margin: 8px 0 14px; }
summary { cursor: pointer; font-weight: 700; }
.pre { white-space: pre-wrap; background: var(--flaeche); padding: 12px; font-size: 15px; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
.tab { border: 0; background: var(--flaeche); font: 700 14px var(--font); padding: 8px 14px; cursor: pointer; border-radius: var(--r-klein) 0 var(--r-klein) 0; color: var(--text); }
.tab.on { background: var(--dark-btn); color: var(--dark-btn-text); }
.check { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--linie); cursor: pointer; position: relative; }
.check:last-child { border-bottom: 0; }
.check input { position: absolute; opacity: 0; }
.box { width: 28px; height: 28px; flex: none; border: 2px solid var(--text); border-radius: 8px 0 8px 0; display: grid; place-items: center; background: var(--card); }
.check input:checked + .box { background: var(--gelb); border-color: var(--auf-gelb); }
.check input:checked + .box::after { content: ''; width: 12px; height: 7px; border-left: 3px solid var(--auf-gelb); border-bottom: 3px solid var(--auf-gelb); transform: rotate(-45deg) translate(1px, -1px); }
.check input:focus-visible + .box { outline: 3px solid var(--gelb-dunkel); outline-offset: 2px; }
.check.done .t { color: var(--grau-hell); text-decoration: line-through; }
.check small { display: block; color: var(--grau-hell); }
.progress { height: 10px; background: var(--chip); border-radius: 5px 0 5px 0; overflow: hidden; margin: 10px 0 4px; }
.progress div { height: 100%; background: var(--gelb); }
.kpi .num { font-size: 44px; font-weight: 900; font-style: italic; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .delta { color: var(--grau); font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--grau); padding: 8px 10px; border-bottom: 2px solid var(--text); }
td { padding: 10px; border-bottom: 1px solid var(--linie); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.empty { text-align: center; padding: 40px 20px; color: var(--grau); }
.chart { width: 100%; height: auto; margin-top: 10px; }
.chart text { font-family: var(--font); font-size: 12px; fill: var(--grau); }
.chart .axis { stroke: var(--rahmen); }
.chart .line { fill: none; stroke: var(--text); stroke-width: 2.5; stroke-linejoin: round; }
.chart .dot { fill: var(--gelb); stroke: var(--text); stroke-width: 2; }
.conn { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
.kw { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; margin-bottom: 22px; }
.kw-label { display: flex; flex-direction: column; align-items: center; padding-top: 14px; }
.kw-label strong { font-size: 30px; font-weight: 900; font-style: italic; line-height: 1; }
.entry { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 18px; padding: 20px 22px; border-radius: var(--r) 0 var(--r) 0; }
.entry.past { opacity: .6; }
.entry-date { font-size: 15px; }
.entry-date strong { display: block; font-size: 22px; font-weight: 900; text-transform: uppercase; }
.entry details { margin: 8px 0 0; }
.pill-tag { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; border-left: 6px solid; padding: 2px 8px; background: var(--flaeche); }
.toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translate(-50%, 20px); background: var(--side); color: #FFFFFF; padding: 12px 22px; border-radius: var(--r) 0 var(--r) 0; opacity: 0; pointer-events: none; transition: .25s; z-index: 10; max-width: 90vw; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 14px 16px; gap: 14px; }
  .logo { width: 110px; }
  nav { flex-direction: row; flex-wrap: wrap; width: 100%; }
  nav a { padding: 8px 10px; font-size: 12px; }
  .who { display: none; }
  main { padding: 24px 16px 80px; }
  h1 { font-size: 30px; }
  .post { grid-template-columns: minmax(0, 1fr); }
  .post .img { max-width: 260px; }
  .kw { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .kw-label { flex-direction: row; gap: 8px; padding: 0; justify-content: flex-start; }
  .entry { grid-template-columns: minmax(0, 1fr); gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { .toast, .btn { transition: none; } }
.head .label { display: block; overflow-wrap: anywhere; }
.side { padding-top: 32px; }
.logo { padding: 4px 0 8px; }
.setup { margin-top: 20px; }
.setup summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; }
.setup summary::-webkit-details-marker { display: none; }
.setup summary::after { content: '+'; font-size: 28px; font-weight: 900; margin-left: auto; color: var(--grau); }
.setup[open] summary::after { content: '\2212'; }
.setup ol { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 8px; max-width: 75ch; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
.improve { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--linie); }
.improve .label { display: block; margin-bottom: 6px; }
.improve-row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.improve-row textarea { min-height: 64px; flex: 1 1 260px; }
.improve-row .btn { align-self: flex-end; }
.improve p { margin: 6px 0 0; }

</style>

<script>
const PLAN = {"title":"Zipperwalls Social Media Redaktionsplan Q4 2026","intro":"2 Posts pro Woche (Di und Do), je eine Variante für Instagram, Facebook, LinkedIn. Grafiken und Texte liegen im Ordner der jeweiligen KW. Spalte 'Status' pflegen.","source":"Redaktionsplan_Social_Media_Q4_2026.xlsx","stand":"2026-10-01","rhythm":{"postsPerWeek":2,"days":["Dienstag","Donnerstag"],"time":"09:00","window":"Vorschlag: Di und Do zwischen 8 und 10 Uhr (B2B-Zielgruppe am Arbeitsplatz)."},"formats":"Instagram und Facebook: 1080 x 1350 px (4:5). LinkedIn: 1200 x 1200 px.","legend":{"Status":"Spalte O pflegen: Entwurf, Freigegeben, Gepostet, Verschoben, Gestrichen.","Platzhalter":"[DATUM] und [ZEITEN] in Post 20 und 23 vor Veröffentlichung ersetzen.","Rot markiert":"Offene Punkte, die vor dem Posten geklärt werden müssen.","Posting-Zeit":"Vorschlag: Di und Do zwischen 8 und 10 Uhr (B2B-Zielgruppe am Arbeitsplatz).","Formate":"Instagram und Facebook: 1080 x 1350 px (4:5). LinkedIn: 1200 x 1200 px.","Preise":"Alle Preise netto (zzgl. MwSt.).","Quelle Texte":"Fakten aus Obsidian: Produktsortiment, Stimme des Kunden, Unternehmen & Rahmendaten, Website (Ratgeber), Stand 08/2026."},"pillars":[{"name":"Ratgeber","count":10},{"name":"Produkte & Anwendung","count":5},{"name":"Über uns","count":2},{"name":"Kundenstimmen","count":2},{"name":"Service","count":2},{"name":"Saison","count":2},{"name":"Hinter den Kulissen","count":1}],"entries":[{"nr":1,"kw":41,"date":"2026-10-06","day":"Di","pillar":"Über uns","topic":"Start: Zipperwalls stellt sich vor","format":"Bildpost 4:5","headline":"JETZT AUCH HIER.","instagram":"Zipperwalls ist jetzt auf Instagram.\nSeit 2019 statten wir B2B-Aussteller mit Messewänden, Messeständen und Messetheken aus. Inklusive Druck, werkzeuglos aufgebaut und mit persönlicher Beratung.\nAb sofort zeigen wir hier Produkte, Praxistipps und Einblicke für Ihren nächsten Messeauftritt.","facebook":"Zipperwalls ist zurück auf Facebook.\nSeit 2019 statten wir Unternehmen, Agenturen, Behörden und Vereine mit Messewänden, Messeständen und Messetheken aus, jeweils inklusive Druck. Unsere Systeme bauen Sie ohne Werkzeug auf, und bei Fragen erreichen Sie uns persönlich.\nAb jetzt finden Sie hier regelmäßig Produktneuheiten, Praxistipps für Ihre Messeplanung und Einblicke hinter die Kulissen. Wir freuen uns auf den Austausch.","linkedin":"Zipperwalls: Messewände, Messestände und Messeausstattung für B2B-Aussteller.\n\nSeit 2019 beliefern wir Industrie, Handel, Handwerk, Agenturen, Behörden und Vereine mit modularen Messesystemen inklusive Druck. Über 950 Produkte, werkzeugloser Aufbau und eine persönliche Beratung, die unsere Kunden bei Trusted Shops mit 4,77 von 5 bewerten.\n\nAuf dieser Seite teilen wir ab sofort regelmäßig Wissen rund um Messeplanung, Standgestaltung und Messetechnik. Folgen Sie uns, wenn Ihr nächster Messeauftritt schon in Planung ist.","hashtags":["#zipperwalls","#messewand","#messestand","#messebau","#messeauftritt"],"files":["KW 41/post-01-instagram-facebook.png","KW 41/post-01-linkedin.png"],"note":"Voraussetzung: Instagram-Account @zipperwalls.de angelegt, Facebook-Infos (Adresse, Telefon, Öffnungszeiten) korrigiert.","status":"Entwurf"},{"nr":2,"kw":41,"date":"2026-10-08","day":"Do","pillar":"Ratgeber","topic":"Messe-Tipp #01: Frühjahrsmessen 2027 jetzt planen","format":"Bildpost 4:5 (optional Karussell)","headline":"FRÜHJAHRSMESSE? JETZT PLANEN.","instagram":"Messe-Tipp #01: Frühjahrsmesse? Jetzt planen.\nWer im Januar bis März ausstellt, legt die Grundlagen im Herbst. Standmaße klären, Druckdaten mit Vorlauf anlegen, Lieferzeit und einen Probeaufbau einplanen.\nSpeichern Sie sich den Tipp für Ihre Messeplanung.","facebook":"Messe-Tipp #01: Die Frühjahrsmessen 2027 beginnen im Herbst.\nDamit im Januar alles steht, lohnen sich jetzt drei Schritte: Standmaße und Standart (Reihe, Ecke, Kopf) klären, Druckdaten mit ausreichend Vorlauf anlegen und Lieferzeit samt Probeaufbau im Büro einplanen.\nSie sind unsicher bei Größe oder Gestaltung? Wir beraten Sie gern persönlich.","linkedin":"Die Frühjahrsmessen 2027 entscheiden sich im Herbst 2026.\n\nIn der Praxis sehen wir immer wieder: Nicht der Aufbau wird knapp, sondern die Zeit davor. Drei Punkte, die wir Ausstellern jetzt empfehlen:\n\n1. Standmaße und Standart (Reihen-, Eck- oder Kopfstand) verbindlich klären.\n2. Druckdaten mit Vorlauf anlegen, inklusive Korrekturschleife.\n3. Lieferzeit und einen Probeaufbau vor der Messe fest einplanen.\n\nWer diese drei Punkte bis Jahresende abhakt, startet entspannt in die Messesaison.","hashtags":["#messetipp","#messeplanung","#messestand","#messeauftritt","#zipperwalls"],"files":["KW 41/post-02-instagram-facebook.png","KW 41/post-02-linkedin.png"],"note":null,"status":"Entwurf"},{"nr":3,"kw":42,"date":"2026-10-13","day":"Di","pillar":"Produkte & Anwendung","topic":"Messewand EASE L: in Minuten aufgebaut","format":"Bildpost 4:5","headline":"IN MINUTEN AUFGEBAUT. OHNE WERKZEUG.","instagram":"In Minuten aufgebaut. Ohne Werkzeug.\nDie Messewand EASE L verbindet einen Aluminiumrahmen im Klicksystem mit einem passgenauen Stoffdruck. Der Druck ist B1-zertifiziert, austauschbar und bei 30 °C waschbar.\nJetzt konfigurieren auf zipperwalls.de","facebook":"Eine Rückwand, die eine Person allein aufbaut.\nDie Messewand EASE L besteht aus einem leichten Aluminiumrahmen im Klicksystem und einem bedruckten Stoffbezug mit Reißverschluss. Erhältlich von 240 bis 600 cm Breite, ein- oder beidseitig bedruckt, wahlweise mit Tragetasche oder Trolley.\nDer Stoff ist B1-zertifiziert und bei 30 °C waschbar. Für die nächste Kampagne tauschen Sie nur den Druck. Jetzt konfigurieren auf zipperwalls.de","linkedin":"Werkzeugloser Aufbau ist kein Komfortmerkmal, sondern ein Kostenfaktor.\n\nDie Messewand EASE L baut eine Person in wenigen Minuten auf: Aluminiumrahmen im Klicksystem, Stoffbezug mit Reißverschluss, fertig. Kein Messebauer, kein Werkzeug, Transport im PKW.\n\nZur Auswahl stehen Breiten von 240 bis 600 cm, ein- oder beidseitiger Druck sowie Tragetasche oder Trolley. Der Stoff ist B1-zertifiziert, waschbar bei 30 °C und für den nächsten Auftritt einfach austauschbar.\n\nDetails und Konfiguration auf zipperwalls.de","hashtags":["#messewand","#messestand","#messebau","#textildruck","#zipperwalls"],"files":["KW 42/post-03-instagram-facebook.png","KW 42/post-03-linkedin.png"],"note":"Produktrender stammt von zipperwalls.de. Für spätere Posts echte Aufbaufotos sammeln.","status":"Entwurf"},{"nr":4,"kw":42,"date":"2026-10-15","day":"Do","pillar":"Kundenstimmen","topic":"Kundenstimme: persönliche Betreuung","format":"Bildpost 4:5","headline":"Persönliche Betreuung ist heute nicht mehr selbstverständlich.","instagram":"Was unsere Kunden am häufigsten hervorheben, ist nicht das Produkt, sondern die Betreuung.\nDanke für diese Bewertung. Bei Fragen zu Größe, Druck oder Lieferzeit erreichen Sie uns Mo bis Fr von 8 bis 17 Uhr persönlich.","facebook":"\"Persönliche Betreuung ist heute nicht mehr selbstverständlich.\"\nDiese Bewertung freut uns besonders, weil sie genau das trifft, was uns wichtig ist. Bei Zipperwalls sprechen Sie mit Menschen, die Ihr Projekt kennen: bei der Auswahl, bei den Druckdaten und bis zur Lieferung.\nSie erreichen uns Mo bis Fr von 8 bis 17 Uhr unter +49 7276 4049970.","linkedin":"Was Kunden über uns schreiben, ist aufschlussreicher als jeder Werbetext.\n\nIn unseren verifizierten Trusted-Shops-Bewertungen (aktuell 4,77 von 5) wird ein Punkt mit Abstand am häufigsten genannt: die persönliche Betreuung. Erreichbarkeit, schnelle Rückmeldungen und klare Absprachen.\n\nFür uns ist das der Maßstab. Messeprojekte haben feste Termine, und wer ausstellt, braucht einen Ansprechpartner, der zuverlässig antwortet.","hashtags":["#kundenstimme","#messestand","#messeauftritt","#zipperwalls"],"files":["KW 42/post-04-instagram-facebook.png","KW 42/post-04-linkedin.png"],"note":"Vor Veröffentlichung Nutzungsbedingungen von Trusted Shops für Zitate in Werbung prüfen. Bewertungsnote 4,77 aktuell halten.","status":"Entwurf"},{"nr":5,"kw":43,"date":"2026-10-20","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #02: Der Motten-Effekt (Licht zieht Besucher an)","format":"Bildpost 4:5","headline":"LICHT ZIEHT BESUCHER AN.","instagram":"Messe-Tipp #02: Licht zieht Besucher an.\nIn einer hellen Halle fällt auf, was selbst leuchtet. Hinterleuchtete Textilwände erzeugen Fernwirkung, schon bevor Besucher vor Ihrem Stand stehen.\nMehr dazu im Ratgeber auf zipperwalls.de/wissen","facebook":"Messe-Tipp #02: der Motten-Effekt.\nBesucher orientieren sich in Messehallen an hellen Flächen. Eine hinterleuchtete Rückwand wirkt deshalb deutlich weiter in den Gang hinein als ein klassisch angestrahlter Druck.\nWorauf es dabei ankommt, lesen Sie in unserem Ratgeber auf zipperwalls.de/wissen","linkedin":"Der Motten-Effekt auf Messen: Was leuchtet, wird gesehen.\n\nIn gleichmäßig ausgeleuchteten Hallen setzen sich selbstleuchtende Flächen klar ab. LED-Textilwände nutzen diesen Effekt: gleichmäßig hinterleuchtet, ohne Blendung, mit Fernwirkung in den Gang.\n\nUnser Ratgeber zeigt, wie Sie Licht gezielt einsetzen und welche Systeme sich für welche Standgröße eignen: zipperwalls.de/wissen","hashtags":["#messetipp","#ledwand","#messedesign","#messestand","#zipperwalls"],"files":["KW 43/post-05-instagram-facebook.png","KW 43/post-05-linkedin.png"],"note":"Basis: Ratgeber 'Motten-Effekt' (16.03.2026).","status":"Entwurf"},{"nr":6,"kw":43,"date":"2026-10-22","day":"Do","pillar":"Produkte & Anwendung","topic":"LED-Messewand / PIXLIP GO: leuchtende Rückwand","format":"Bildpost 4:5 oder Reel","headline":"IHRE RÜCKWAND LEUCHTET.","instagram":"Ihre Rückwand leuchtet.\nLED-Messewände und Lightboxen wie PIXLIP GO bringen Ihr Motiv gleichmäßig hinterleuchtet in den Gang. Modular, mit Textildruck und schnell aufgebaut.\nMehr im Shop auf zipperwalls.de","facebook":"Wenn Ihr Stand auch in einer vollen Halle auffallen soll: LED-Messewände und Lightboxen wie die PIXLIP GO setzen Ihr Motiv gleichmäßig in Szene. Modular kombinierbar, mit beidseitigem Textildruck und ohne Werkzeug aufgebaut.\nAlle Modelle finden Sie auf zipperwalls.de","linkedin":"Leuchtende Textilwände sind auf Messen längst Standard. Entscheidend ist, wie schnell sie stehen.\n\nModulare Lightbox-Systeme wie PIXLIP GO verbinden gleichmäßige Hinterleuchtung mit werkzeuglosem Aufbau. Einzelne Module lassen sich zu größeren Wänden kombinieren und für den nächsten Auftritt neu bespannen.\n\nÜbersicht über LED-Messewände und Lightboxen: zipperwalls.de","hashtags":["#ledwand","#lightbox","#pixlip","#messestand","#zipperwalls"],"files":["KW 43/post-06-instagram-facebook.png","KW 43/post-06-linkedin.png"],"note":"Bild von zipperwalls.de holen.","status":"Entwurf"},{"nr":7,"kw":44,"date":"2026-10-27","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #03: Kompletter Messestand im PKW","format":"Bildpost 4:5","headline":"IHR STAND PASST INS AUTO.","instagram":"Messe-Tipp #03: Ihr Stand passt ins Auto.\nTextile Messesysteme reisen zerlegt in Tasche oder Trolley. Das spart Spedition, Lagerfläche und Abstimmung mit dem Messebauer.\nMehr im Ratgeber auf zipperwalls.de/wissen","facebook":"Messe-Tipp #03: Nie wieder Spedition.\nEin kompletter Messestand aus Textilwänden und Theke passt in den Kofferraum eines Kombis. Rahmen zerlegt in Tasche oder Trolley, Stoffdrucke knitterarm gefaltet.\nWie das in der Praxis aussieht, zeigt unser Ratgeber auf zipperwalls.de/wissen","linkedin":"Logistik ist auf Messen oft der unterschätzte Kostenblock.\n\nTextile Messesysteme lassen sich zerlegt im PKW transportieren: Aluminiumrahmen in Tasche oder Trolley, Stoffdrucke gefaltet. Das spart Speditionskosten, Lagerfläche und feste Anlieferzeiten.\n\nWie ein kompletter Stand in einen Kombi passt, beschreibt unser Ratgeber: zipperwalls.de/wissen","hashtags":["#messetipp","#messelogistik","#messestand","#messebau","#zipperwalls"],"files":["KW 44/post-07-instagram-facebook.png","KW 44/post-07-linkedin.png"],"note"  Bei mehreren Auftritten im Jahr lohnt sich ein eigenes System häufig, weil Sie nur noch die Drucke wechseln. Lager und Transport gehören aber in die Rechnung.\nUnser Ratgeber rechnet beide Varianten durch: zipperwalls.de/wissen","linkedin":"Mieten oder kaufen? Eine Frage, die wir in fast jeder Beratung hören.\n\nUnsere Faustregel: Je häufiger Sie ausstellen, desto eher lohnt sich ein eigenes System. Der Rahmen bleibt, nur der Druck wechselt mit der Kampagne. Fair gerechnet gehören Lagerung und Transport mit in den Vergleich.\n\nDie ausführliche Gegenüberstellung finden Sie in unserem Ratgeber: zipperwalls.de/wissen","hashtags":["#messetipp","#messeplanung","#messebudget","#messestand","#zipperwalls"],"files":["KW 45/post-09-instagram-facebook.png","KW 45/post-09-linkedin.png"],"note":"Faustregel 'wer oft ausstellt' , mit dem Ratgeber-Artikel abgleichen und ggf. anpassen.","status":"Entwurf"},{"nr":10,"kw":45,"date":"2026-11-05","day":"Do","pillar":"Produkte & Anwendung","topic":"Ersatzdrucke: neue Kampagne, gleiches System","format":"Bildpost 4:5 (Vorher/Nachher)","headline":"NEUE KAMPAGNE. GLEICHES SYSTEM.","instagram":"Neue Kampagne. Gleiches System.\nFür fast jede unserer Messewände und Theken gibt es passgenaue Ersatzdrucke. Rahmen behalten, Motiv tauschen, fertig.\nMehr im Shop auf zipperwalls.de","facebook":"Neues Logo, neue Produktlinie oder eine andere Messe? Sie brauchen keine neue Wand.\nFür nahezu alle unsere Systeme bieten wir passgenaue Ersatzdrucke an. Der Aluminiumrahmen bleibt, nur der Stoffbezug wird getauscht. Das spart Kosten und Lagerplatz.\nErsatzdrucke finden Sie direkt beim jeweiligen Produkt auf zipperwalls.de","linkedin":"Nachhaltigkeit im Messebau beginnt beim Rahmen, den man nicht wegwirft.\n\nUnsere textilen Systeme sind auf Wiederverwendung ausgelegt: Der Aluminiumrahmen bleibt über Jahre im Einsatz, für jede neue Kampagne wird nur der Stoffbezug getauscht. Gedruckt wird im Sublimationsverfahren ohne Lösungs- und Bindemittel.\n\nPassende Ersatzdrucke gibt es für nahezu alle Systeme im Shop: zipperwalls.de","hashtags":["#ersatzdruck","#textildruck","#messewand","#nachhaltigkeit","#zipperwalls"],"files":["KW 45/post-10-instagram-facebook.png","KW 45/post-10-linkedin.png"],"note":null,"status":"Entwurf"},{"nr":11,"kw":46,"date":"2026-11-10","day":"Di","pillar":"Saison","topic":"Weihnachtsmarkt und Winter-Events: Outdoor-Ausstattung","format":"Bildpost 4:5","headline":"BEREIT FÜR DEN WEIHNACHTSMARKT?","instagram":"Bereit für den Weihnachtsmarkt?\nFaltzelte, Beachflags und aufblasbare Zelte mit Ihrem Branding sorgen auch draußen für Sichtbarkeit. Planen Sie die Lieferzeit rechtzeitig ein.\nMehr im Shop auf zipperwalls.de","facebook":"Vereinsstand, Firmenaktion oder Stand auf dem Weihnachtsmarkt: Auch draußen soll Ihr Auftritt erkennbar sein.\nBedruckte Faltzelte, Beachflags und aufblasbare Zelte bringen Ihr Branding auf jede Fläche. Damit alles rechtzeitig vor Ort ist, empfehlen wir, jetzt zu bestellen.\nAlle Outdoor-Produkte auf zipperwalls.de","linkedin":"Die Wintersaison ist für viele Unternehmen, Kommunen und Vereine Hochsaison für Außenauftritte.\n\nFür Weihnachtsmärkte, Winterevents und Aktionstage führen wir bedruckte Faltzelte, Beachflags, Werbetore und aufblasbare Zelte. Alle Systeme sind für den schnellen Auf- und Abbau ausgelegt.\n\nWer im Dezember draußen sichtbar sein will, sollte die Lieferzeit jetzt einplanen: zipperwalls.de","hashtags":["#outdoorwerbung","#faltzelt","#beachflag","#eventausstattung","#zipperwalls"],"files":["KW 46/post-11-instagram-facebook.png","KW 46/post-11-linkedin.png"],"note":"Konkrete Lieferzeit für Outdoor-Produkte vor Post prüfen. FOTO fehlt: Shop-Bilder der Faltzelte zeigen das Lieferantenlogo, eigenes Foto oder neutrales Render nötig.","status":"Entwurf"},{"nr":12,"kw":46,"date":"2026-11-12","day":"Do","pillar":"Hinter den Kulissen","topic":"So entsteht Ihr Stoffdruck","format":"Bildpost 4:5 oder Reel","headline":"SO ENTSTEHT IHR STOFFDRUCK.","instagram":"So entsteht Ihr Stoffdruck.\nWir drucken im Sublimationsverfahren: Die Farbe geht in die Faser über, statt auf ihr zu liegen. Ergebnis: brillant, knitterarm und waschbar bei 30 °C.","facebook":"Wie kommt Ihr Motiv auf den Stoff?\nIm Sublimationsdruck wird die Farbe unter Hitze direkt in die Faser übertragen. Dadurch bleibt der Druck brillant, scheuert nicht ab und übersteht die Wäsche bei 30 °C. Der Stoff ist B1-zertifiziert, also für Messehallen zugelassen.\nFragen zum Druck? Wir beraten Sie gern.","linkedin":"Was hinter einem guten Messedruck steckt.\n\nWir drucken unsere Textilien im Sublimationsverfahren, ohne Lösungs- und Bindemittel. Die Farbe verbindet sich mit der Faser, statt eine Schicht zu bilden. Das sorgt für brillante Farben, knitterarme Oberflächen und Waschbarkeit bei 30 °C.\n\nDer Stretch-Display-Stoff ist B1-zertifiziert und damit für den Einsatz in Messehallen geeignet.","hashtags":["#textildruck","#sublimationsdruck","#messewand","#b1","#zipperwalls"],"files":["KW 46/post-12-instagram-facebook.png","KW 46/post-12-linkedin.png"],"note":"Prüfen, ob Fotos oder Videos vom Druckpartner genutzt werden dürfen.","status":"Entwurf"},{"nr":13,"kw":47,"date":"2026-11-17","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #05: Leadgenerierung auf der Messe","format":"Bildpost 4:5","headline":"KONTAKTE STATT VISITENKARTEN.","instagram":"Messe-Tipp #05: Kontakte statt Visitenkarten.\nEin Stapel Karten ist noch kein Ergebnis. Legen Sie Tagesziele fest, erfassen Sie Gespräche direkt am Stand und fassen Sie schnell nach.\nMehr im Ratgeber auf zipperwalls.de/wissen","facebook":"Messe-Tipp #05: Was nach der Messe zählt, sind qualifizierte Kontakte.\nDrei Gewohnheiten machen den Unterschied: ein klares Ziel pro Messetag, Gesprächsnotizen direkt am Stand und ein Nachfassen innerhalb von zwei Tagen.\nMehr dazu in unserem Ratgeber: zipperwalls.de/wissen","linkedin":"Der Erfolg einer Messe entscheidet sich nach der Messe.\n\nDrei Punkte, die wir Ausstellern empfehlen:\n1. Ein messbares Ziel pro Messetag festlegen.\n2. Gesprächsinhalte direkt am Stand erfassen, nicht abends aus dem Gedächtnis.\n3. Innerhalb von 48 Stunden nachfassen.\n\nAusführlich in unserem Ratgeber zur Leadgenerierung: zipperwalls.de/wissen","hashtags":["#messetipp","#leadgenerierung","#messemarketing","#b2bmarketing","#zipperwalls"],"files":["KW 47/post-13-instagram-facebook.png","KW 47/post-13-linkedin.png"],"note":"Basis: Ratgeber 'Leadgenerierung auf der Messe'.","status":"Entwurf"},{"nr":14,"kw":47,"date":"2026-11-19","day":"Do","pillar":"Produkte & Anwendung","topic":"Messestand-Sets: Wand und Theke als System","format":"Bildpost 4:5","headline":"WAND UND THEKE. EIN STAND.","instagram":"Wand und Theke. Ein Stand.\nUnsere Messestand-Sets kombinieren Rückwand und Theke im abgestimmten Design, inklusive Druck. Als Reihen-, Eck- oder Kopfstand.\nAlle Sets auf zipperwalls.de","facebook":"Sie möchten nicht jedes Teil einzeln zusammensuchen? Unsere Messestand-Sets bringen Rückwand und Theke im abgestimmten Design mit, inklusive Druck und meist mit LED-Counter.\nVom Eckstand mit 3 x 3 m bis zum Kopfstand mit Kabine.\nAlle Sets auf zipperwalls.de","linkedin":"Ein stimmiger Messestand entsteht aus aufeinander abgestimmten Elementen.\n\nUnsere Messestand-Sets kombinieren Messewand und Theke in einem Design, inklusive Druck. Erhältlich als Reihen-, Eck- oder Kopfstand, von kompakten 3 x 3 m bis zu großen Flächen mit Kabine.\n\nDer Vorteil: eine Bestellung, ein Druckdatensatz, ein durchgängiges Erscheinungsbild. Übersicht auf zipperwalls.de","hashtags":["#messestand","#messebau","#messetheke","#standbau","#zipperwalls"],"files":["KW 47/post-14-instagram-facebook.png","KW 47/post-14-linkedin.png"],"note":null,"status":"Entwurf"},{"nr":15,"kw":48,"date":"2026-11-24","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #06: Das Klick-Prinzip, Aufbau in Minuten","format":"Reel (15 bis 30 s) + Bildpost","headline":"AUFBAU IN MINUTEN.","instagram":"Messe-Tipp #06: Aufbau in Minute  bleiben jahrelang im Einsatz, nur die Drucke wechseln mit der Kampagne. Wer jetzt bestellt, startet mit fertiger Ausstattung in die Frühjahrsmessen 2027.\n\nGern stellen wir Ihnen ein Paket für Ihr Messejahr zusammen.","hashtags":["#messeplanung","#messebudget","#messestand","#b2bmarketing","#zipperwalls"],"files":["KW 48/post-16-instagram-facebook.png","KW 48/post-16-linkedin.png"],"note":"Keine steuerlichen Aussagen (Abschreibung o.ä.) machen.","status":"Entwurf"},{"nr":17,"kw":49,"date":"2026-12-01","day":"Di","pillar":"Ratgeber","topic":"Messe-Tipp #07: Hausmesse im Januar planen","format":"Bildpost 4:5 oder Karussell","headline":"HAUSMESSE IM JANUAR?","instagram":"Messe-Tipp #07: Hausmesse im Januar?\nMit Messewänden gliedern Sie eigene Räume in Themeninseln und schaffen Messeatmosphäre im Unternehmen.\nMehr im Ratgeber auf zipperwalls.de/wissen","facebook":"Messe-Tipp #07: Die Hausmesse als Jahresauftakt.\nViele Unternehmen laden im Januar Kunden ins eigene Haus ein. Mit Messewänden und Theken gliedern Sie Lager, Showroom oder Kantine in klare Themeninseln. Termin und Einladungen sollten jetzt stehen.\nCheckliste im Ratgeber: zipperwalls.de/wissen","linkedin":"Die Hausmesse ist für viele Mittelständler der wichtigste Kundentermin im Jahr.\n\nWer im Januar einlädt, sollte Termin und Einladungen jetzt festlegen. Mit mobilen Messewänden und Theken lassen sich eigene Räume in Themeninseln gliedern, ohne bauliche Veränderung, und die Ausstattung ist im nächsten Jahr wieder einsatzbereit.\n\nUnser Ratgeber zur Hausmesse: zipperwalls.de/wissen","hashtags":["#hausmesse","#messetipp","#eventplanung","#messewand","#zipperwalls"],"files":["KW 49/post-17-instagram-facebook.png","KW 49/post-17-linkedin.png"],"note":"Basis: Ratgeber 'Hausmesse planen'.","status":"Entwurf"},{"nr":18,"kw":49,"date":"2026-12-03","day":"Do","pillar":"Kundenstimmen","topic":"Kundenstimme: Service, Abwicklung, Qualität","format":"Bildpost 4:5","headline":"Top-Kundenservice, reibungslose Abwicklu // Reine Funktionen: Textaufbereitung und Pruefung je Kanal (ohne Netzwerk, gut testbar)
const CHANNELS = ['facebook', 'instagram', 'linkedin'];

const LIMITS = {
  facebook: 63000,
  instagram: 2200,
  linkedin: 3000,
};

function normalizeHashtags(list) {
  const out = [];
  for (const raw of Array.isArray(list) ? list : []) {
    const t = String(raw).trim().replace(/^#+/, '').replace(/\s+/g, '');
    if (t && !out.includes(t)) out.push(t);
  }
  return out.map((t) => '#' + t);
}

function composeText(post, channel) {
  const variants = typeof post.variants === 'string' ? JSON.parse(post.variants || '{}') : post.variants || {};
  const tags = normalizeHashtags(typeof post.hashtags === 'string' ? JSON.parse(post.hashtags || '[]') : post.hashtags);
  let text = String(variants[channel] || post.body || '').trim();
  const missing = tags.filter((t) => !text.toLowerCase().includes(t.toLowerCase()));
  if (missing.length) text += '\n\n' + missing.join(' ');
  return text;
}

// Gibt eine Fehlermeldung (Deutsch) oder null zurueck
function validate(channel, text, hasImage) {
  if (!text) return 'Kein Text vorhanden.';
  const placeholder = findPlaceholder(text);
  if (placeholder) return `Platzhalter ${placeholder} im Text noch ersetzen.`;
  const forbidden = findForbidden(text);
  if (forbidden) return `„${forbidden}“ darf nicht vorkommen: keine Angaben zur Herkunft der Produkte.`;
  if (text.length > LIMITS[channel]) return `Text zu lang (${text.length} von ${LIMITS[channel]} Zeichen).`;
  if (channel === 'instagram') {
    if (!hasImage) return 'Instagram braucht ein Bild.';
    const tags = (text.match(/(^|\s)#\w+/g) || []).length;
    if (tags > 30) return `Zu viele Hashtags (${tags}, maximal 30).`;
  }
  return null;
}

// LinkedIn "little text format": reservierte Zeichen muessen maskiert werden.
// Hashtags (# direkt vor einem Wort am Wortanfang) bleiben erhalten.
function escapeLinkedIn(text) {
  const reserved = /[\\|{}@\[\]()<>*_~]/g;
  let out = '';
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '#') {
      const prevOk = i === 0 || /\s/.test(text[i - 1]);
      const nextOk = /[\p{L}\p{N}]/u.test(text[i + 1] || '');
      out += prevOk && nextOk ? '#' : '\\#';
    } else {
      out += c.replace(reserved, (m) => '\\' + m);
    }
  }
  return out;
}

// ISO Kalenderwoche, z. B. 2026-W40
function isoWeek(date = new Date()) {
  const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const yearStart = Date.UTC(d.getUTCFullYear(), 0, 1);
  const week = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
}

// Platzhalter wie [DATUM] oder [ZEITEN] aus dem Redaktionsplan duerfen nie veroeffentlicht werden
function findPlaceholder(text) {
  const m = /\[[A-ZÄÖÜ][A-ZÄÖÜ _-]{2,}\]/.exec(text || '');
  return m ? m[0] : null;
}

// Ortszeit Berlin (z. B. "2026-10-06", "09:00") in UTC ISO umrechnen, Sommer und Winterzeit beachtet
function berlinToUtc(date, time = '09:00') {
  const [y, mo, d] = date.split('-').map(Number);
  const [h, mi] = time.split(':').map(Number);
  const guess = Date.UTC(y, mo - 1, d, h, mi);
  const offset = (ts) => {
    const parts = Object.fromEntries(
      new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Berlin', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
        .formatToParts(new Date(ts))
        .map((x) => [x.type, x.value]),
    );
    return Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute) - ts;
  };
  return new Date(guess - offset(guess - offset(guess))).toISOString();
}

// Keine Herkunftsangaben: Ortsnamen und "Made in" Aussagen sind tabu (Vorgabe Bela und Darien)
const FORBIDDEN = [/herxheim/i, /aus deutschland/i, /in deutschland (hergestellt|produziert|gefertigt|gedruckt)/i, /made in germany/i, /deutsche[nr]? (produktion|fertigung|qualität)/i, /hergestellt in/i, /produziert in/i];
function findForbidden(text) {
  for (const re of FORBIDDEN) {
    const m = re.exec(text || '');
    if (m) return m[0];
  }
  return null;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 4500);
}

function hydrate(p) {
  const post = { variants: {}, hashtags: [], channels: CHANNEL_KEYS, results: {}, ...p };
  post.preview = Object.fromEntries(CHANNEL_KEYS.map((c) => [c, composeText(post, c)]));
  post.placeholder = post.channels.map((c) => findPlaceholder(post.preview[c])).find(Boolean) || null;
  return post;
}

// Zweistufige Bestaetigung im Button selbst (confirm() ist im Artefakt nicht verfuegbar)
function confirmClick(btn, question, action) {
  if (btn.dataset.armed) return action();
  const label = btn.textContent;
  btn.dataset.armed = '1';
  btn.textContent = question;
  btn.classList.add('armed');
  setTimeout(() => {
    if (!btn.isConnected) return;
    delete btn.dataset.armed;
    btn.textContent = label;
    btn.classList.remove('armed');
  }, 4000);
}

async function write(fn) {
  if (!S.db) throw new Error('Speichern ist in dieser Ansicht nicht möglich. Bitte das Artefakt auf claude.ai öffnen und anmelden.');
  try {
    return await fn(S.db);
  } catch (e) {
    throw new Error(e?.code === 'not_granted' ? 'Keine Schreibrechte für dieses Dashboard.' : e?.message || 'Speichern fehlgeschlagen.');
  }
}

// Plan Eintrag als Entwurf uebernehmen: Texte je Kanal, Hashtags, Termin 09:00 Berliner Zeit
async function draftFromPlan(nr) {
  const e = PLAN.entries.find((x) => x.nr === nr);
  const existing = S.posts.find((p) => p.plan_nr === nr && p.status !== 'rejected');
  if (existing) throw new Error('Zu diesem Eintrag gibt es schon einen Post.');
  const notes = [
    `Plan Nr. ${e.nr}, KW ${e.kw}, ${e.pillar}. Format: ${e.format}.`,
    e.headline ? `Bildtext: ${e.headline}` : null,
    e.files?.length ? `Grafiken: ${e.files.join(', ')}` : null,
    e.note ? `Offen: ${e.note}` : null,
  ].filter(Boolean).join('\n');
  await write((db) => db.collection('posts').doc(`plan-${nr}`).set({
    title: `#${e.nr} ${e.topic}`,
    plan_nr: e.nr,
    status: 'draft',
    body: e.facebook || e.instagram || e.linkedin,
    variants: { instagram: e.instagram, facebook: e.facebook, linkedin: e.linkedin },
    hashtags: normalizeHashtags(e.hashtags),
    channels: CHANNEL_KEYS,
    image: null,
    image_linkedin: null,
    notes,
    scheduled_at: e.date ? berlinToUtc(e.date, PLAN.rhythm.time) : null,
    results: {},
    source: 'plan',
    created_at: nowIso(),
    updated_at: nowIso(),
  }));
}

function bindPost(el, p) {
  el.querySelectorAll('[data-tab]').forEach((t) => (t.onclick = () => {
    el.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === t));
    el.querySelectorAll('[data-pane]').forEach((x) => (x.hidden = x.dataset.pane !== t.dataset.tab));
  }));
  // Solange hier getippt wird, keine Live-Aktualisierung dieser Ansicht (sonst gingen Eingaben verloren)
  el.querySelectorAll('input, textarea').forEach((i) => i.addEventListener('input', () => S.dirty.add(p.id)));
  const val = (f) => el.querySelector(`[data-f="${f}"]`)?.value;
  const collect = () => {
    const variants = Object.fromEntries([...el.querySelectorAll('[data-v]')].map((t) => [t.dataset.v, t.value]));
    return {
      title: val('title'),
      variants,
      body: variants.facebook,
      hashtags: normalizeHashtags((val('hashtags') || '').split(/[\s,]+/)),
      channels: [...el.querySelectorAll('[data-ch]:checked')].map((x) => x.dataset.ch),
      updated_at: nowIso(),
    };
  };
  const done = (msg) => {
    S.dirty.delete(p.id);
    if (msg) toast(msg);
    render();
  };
  const fail = (e) => {
    toast(e.message);
    el.querySelectorAll('button').forEach((b) => (b.disabled = false));
  };
  // Pruefung vor der Freigabe: gleiche Regeln wie im Veroeffentlichungs-Skript
  const check = (data) => {
    if (!data.channels.length) throw new Error('Bitte mindestens einen Kanal wählen.');
    const draft = hydrate({ ...p, ...data });
    if (draft.placeholder) throw new Error(`Platzhalter ${draft.placeholder} im Text noch ersetzen.`);
    for (const c of data.channels) {
      if (draft.results?.[c]?.status === 'ok') continue;
      const problem = validate(c, draft.preview[c], c === 'linkedin' ? !!(p.image_linkedin || p.image) : !!p.image);
      if (problem) throw new Error(`${CH[c]}: ${problem}`);
    }
  };

  el.querySelectorAll('[data-act]').forEach((btn) => {
    const act = btn.dataset.act;
    if (act === 'improve') {
      btn.onclick = async () => {
        const box = el.querySelector('[data-imp]');
        const hint = el.querySelector('[data-imp-hint]');
        const wish = box.value.trim();
        if (!wish) return toast('Bitte erst beschreiben, was Claude ändern soll.');
        if (!S.comments) return toast('Senden an Claude ist in dieser Ansicht nicht verfügbar. Bitte das Dashboard auf claude.ai öffnen.');
        btn.disabled = true;
        try {
          const state = await S.comments.canSendToClaude();
          if (state !== 'available') {
            const why = {
              no_session: 'Gerade hört keine Claude-Sitzung zu. Öffnen Sie die Claude-Sitzung zum Dashboard und versuchen Sie es erneut.',
              writers_only: 'Senden an Claude ist nur für Bearbeiter dieses Dashboards möglich.',
              off: 'Senden an Claude ist hier ausgeschaltet.',
            };
            throw new Error(why[state] || 'Senden an Claude ist gerade nicht möglich.');
          }
          const anchor = await S.comments.anchorFor(el);
          const text = `Wunsch aus dem Dashboard zu Post „${p.title}“ (ID ${p.id}, Status ${p.status}):\n${wish}`.slice(0, 3900);
          await S.comments.sendToClaude({ anchor, text });
          box.value = '';
          S.dirty.delete(p.id);
          hint.textContent = 'Gesendet. Claude kümmert sich darum, die Änderung erscheint hier automatisch.';
          toast('An Claude gesendet.');
        } catch (e) {
          const msg = { consent_required: 'Bitte erlauben Sie dem Dashboard einmalig, Kommentare zu schreiben, und senden Sie erneut.', forbidden: 'Kommentieren aus dem Dashboard ist hier ausgeschaltet.', rate_limited: 'Kurz warten, dann erneut senden.', claude_unavailable: 'Claude ist gerade nicht erreichbar. Ihr Text ist noch da, bitte später erneut senden.' }[e?.code];
          toast(msg || e?.message || 'Senden fehlgeschlagen.');
        }
        btn.disabled = false;
      };
      return;
    }
    if (act === 'image') {
      btn.onchange = async () => {
        const file = btn.files[0];
        if (!file) return;
        try {
          if (!['image/jpeg', 'image/png'].includes(file.type)) throw new Error('Bitte JPEG oder PNG hochladen.');
          if (file.size > 8 * 1024 * 1024) throw new Error('Bild größer als 8 MB.');
          toast('Bild wird hochgeladen …');
          const up = await S.assets.upload(file);
          await write(() => postRef(p.id).update({ [btn.dataset.field]: up.id, updated_at: nowIso() }));
          toast('Bild gespeichert.');
        } catch (e) {
          toast(e?.code === 'too_large' ? 'Bild zu groß.' : e.message || 'Hochladen fehlgeschlagen.');
        }
      };
      return;
    }
    btn.onclick = async () => {
      try {
        if (act === 'approve') {
          const data = collect();
          check(data);
          const planned = p.scheduled_at && new Date(p.scheduled_at) > new Date();
          return confirmClick(btn, planned ? `Für ${fmtDate(p.scheduled_at)} freigeben?` : 'Jetzt freigeben?', async () => {
            await write(() => postRef(p.id).update({
              ...data,
              status: planned ? 'scheduled' : 'approved',
              scheduled_at: planned ? p.scheduled_at : nowIso(),
              approved_at: nowIso(),
            }));
            done(planned ? `Freigegeben für ${fmtDate(p.scheduled_at)}.` : 'Freigegeben. Claude veröffentlicht beim nächsten Lauf.');
          });
        }
      } catch (e) {
        fail(e);
      }
    };
  });
}

let week = null;
function shiftWeek(w, d) {
  const [y, n] = w.split('-W').map(Number);
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const monday = new Date(jan4.getTime() - ((jan4.getUTCDay() || 7) - 1) * 86400000 + (n - 1 + d) * 7 * 86400000);
  return isoWeek(new Date(monday.getTime() + 3 * 86400000));
}
function viewCheckliste() {

        ${block(week, WEEKLY_TEMPLATE)}
      </section>

    </div>`;
  main.querySelectorAll('[data-w]').forEach((b) => (b.onclick = () => { week = b.dataset.w === '0' ? current : shiftWeek(week, Number(b.dataset.w)); render(); }));

    const { doc, key } = cb.dataset;

    } catch (e) {
      toast(e.message);
      cb.checked = !cb.checked;
    }
  }));
}

// ---------- Zahlen ----------
function lineChart(points) {
  if (points.length < 2) return `<p class="muted small">Verlauf erscheint ab dem zweiten Messtag.</p>`;
  const W = 520, H = 160, P = 28;
  const ys = points.map((p) => p.value);
  const min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
  const x = (i) => P + (i * (W - 2 * P)) / (points.length - 1);
  const y = (v) => H - P - ((v - min) / span) * (H - 2 * P);
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const last = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Follower Verlauf">
    <line class="axis" x1="${P}" x2="${W - P}" y1="${H - P}" y2="${H - P}"/>
    <path class="line" d="${d}"/>
    <circle class="dot" cx="${x(points.length - 1)}" cy="${y(last.value)}" r="5"/>
    <text x="${P}" y="${H - 8}">${esc(points[0].date)}</text><text x="${W - P}" y="${H - 8}" text-anchor="end">${esc(last.date)}</text>
  </svg>`;
}
function viewZahlen() {
  const series = [...S.metrics].sort((a, b) => a.id.localeCompare(b.id));
  const published = [];
  for (const p of S.posts) for (const [c, r] of Object.entries(p.results || {})) if (r.status === 'ok') published.push({ title: p.title, channel: c, ...r });
  published.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  const cutoff = new Date(Date.now() - 30 * 86400000).toISOString();
  const recent = published.filter((p) => p.at >= cutoff);
  const sum = (k) => recent.reduce((s, p) => s + (p.stats?.[k] || 0), 0);
  const followers = (c) => series.filter((m) => m[c]?.account?.followers != null).map((m) => ({ date: m.id, value: m[c].account.followers }));
  const has = series.length > 0 || published.length > 0;
  main.innerHTML = `
    <div class="head"><h1>Zahlen</h1><p>Follower und Interaktionen je Kanal. Claude holt die Werte jeden Morgen.</p></div>
    ${!has ? `<div class="card empty"><h2>Noch keine Zahlen</h2><p style="margin-top:10px">Sobald die Konten verbunden und die ersten Posts veröffentlicht sind, erscheinen hier Follower, Reichweite und Interaktionen.</p></div>` : `
    <section class="section grid g3">
      <div class="card kpi"><span class="label">Veröffentlichte Posts</span><div class="num">${fmtNum(S.posts.filter((p) => ['published', 'partial'].includes(p.status)).length)}</div></div>
      <div class="card kpi"><span class="label">Interaktionen (30 Tage)</span><div class="num">${fmtNum(sum('likes') + sum('comments') + sum('shares'))}</div><div class="delta">Likes, Kommentare, Teilen</div></div>
      <div class="card kpi"><span class="label">Reichweite (30 Tage)</span><div class="num">${fmtNum(sum('reach'))}</div><div class="delta">Instagram und LinkedIn Unternehmensseite</div></div>
    </section>
    <section class="section grid g3">${CHANNEL_KEYS.map((c) => {
      const pts = followers(c);
      const v = pts.at(-1)?.value;
      const base = pts.find((p) => p.date >= cutoff.slice(0, 10))?.value;
      const delta = v != null && base != null ? v - base : null;
      return `<div class="card kpi"><span class="label">${CH[c]} Follower</span><div class="num">${v != null ? fmtNum(v) : 'k. A.'}</div>
        <div class="delta">${delta != null ? `${delta >= 0 ? '+' : ''}${fmtNum(delta)} in 30 Tagen` : c === 'linkedin' ? 'Nur mit Unternehmensseite verfügbar' : 'noch keine Daten'}</div>
        ${pts.length ? lineChart(pts) : ''}</div>`;
    }).join('')}</section>
    <section class="section"><h2>Posts</h2><div class="card tablewrap"><table>
      <thead><tr><th>Post</th><th>Kanal</th><th>Datum</th><th class="n">Reichweite</th><th class="n">Likes</th><th class="n">Komm.</th><th class="n">Geteilt</th></tr></thead>
      <tbody>${published.map((p) => `<tr><td>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</td><td>${CH[p.channel]}</td><td>${fmtDate(p.at)}</td>
        ${['reach', 'likes', 'comments', 'shares'].map((k) => `<td class="n">${p.stats?.[k] != null ? fmtNum(p.stats[k]) : 'k. A.'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}`;
}

// ---------- Verbindungen ----------
function viewVerbindungen() {
  const conn = S.status.connections || {};
  const runner = S.status.runner;
  const info = {
    facebook: ['Postet auf die Zipperwalls Facebook Seite.', 'META_PAGE_TOKEN, META_PAGE_ID'],
    instagram: ['Voraussetzung: Instagram Business oder Creator Konto, verknüpft mit der Facebook Seite.', 'IG_USER_ID (nutzt dasselbe Seiten-Token)'],
    linkedin: ['Postet ausschließlich auf die Unternehmensseite zipperwalls.de. Bis LinkedIn die Community Management API freigibt, ist LinkedIn pausiert.', 'LINKEDIN_TOKEN, LINKEDIN_TOKEN_EXPIRES, LINKEDIN_AUTHOR'],
  };
  main.innerHTML = `
    <div class="head"><h1>Verbindungen</h1><p>Die Zugangsdaten liegen nicht im Dashboard, sondern geschützt in der Claude Umgebung. Claude prüft sie bei jedem Lauf und meldet hier den Stand.</p></div>
    <div class="card" style="margin-bottom:16px"><span class="label">Letzter Lauf von Claude</span>
      <p style="margin:6px 0 0">${runner?.last_run ? `${fmtDate(runner.last_run)}. ${esc(runner.summary || '')}` : 'Noch kein Lauf. Sobald die Routine eingerichtet ist, steht hier der letzte Lauf.'}</p></div>
    <div class="grid" style="gap:16px">${CHANNEL_KEYS.map((c) => {
      const s = conn[c];
      const warn = s?.days_left != null && s.days_left < 10;
      return `<div class="card conn"><div style="min-width:0"><h2>${CH[c]}</h2>
        <p style="margin:6px 0">${s?.ok ? `<span class="badge">Verbunden</span> ${esc(s.label || '')}` : s ? `<span class="badge dark">Fehler</span> ${esc(s.error || '')}` : '<span class="badge grey">Nicht eingerichtet</span>'}</p>
        <p class="muted small" style="max-width:60ch">${info[c][0]}${s?.days_left != null ? `<br>${warn ? '<strong>' : ''}Token gültig noch ${s.days_left} Tage${warn ? '. Bitte erneuern.</strong>' : ''}` : ''}${s?.checked_at ? `<br>Geprüft ${fmtDate(s.checked_at)}` : ''}</p>
        <p class="muted small">Umgebungsvariablen: <code>${info[c][1]}</code></p></div></div>`;
    }).join('')}</div>
    <details class="card setup" ${CHANNEL_KEYS.some((c) => conn[c]?.ok) ? '' : 'open'}>
      <summary><h2>So richten Sie die Zugänge ein</h2></summary>
      <p class="muted small" style="margin-top:12px">Einmalig, etwa 30 bis 60 Minuten. Ausführlich in docs/SETUP.md im Repository.</p>
      ${SETUP_STEPS.map((g) => `<h3 style="margin-top:22px">${esc(g.title)}</h3><ol>${g.steps.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>`).join('')}
    </details>`;
}

// ---------- Rahmen ----------
const views = { plan: viewPlan, freigabe: viewFreigabe, checkliste: viewCheckliste, zahlen: viewZahlen, verbindungen: viewVerbindungen };
const currentView = () => (views[location.hash.slice(1)] ? location.hash.slice(1) : 'freigabe');

function render() {
  // Waehrend in der Freigabe getippt wird, nicht neu zeichnen
  if (currentView() === 'freigabe' && S.dirty.size && main.querySelector('.post')) {
    S.pending = true;
    document.getElementById('pending').hidden = false;
    return;
  }
  S.pending = false;
  document.getElementById('pending').hidden = true;
  const view = currentView();
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.view === view));
  const open = S.posts.filter((p) => ['draft', 'failed', 'partial'].includes(p.status)).length;
  const c = document.getElementById('count-freigabe');
  c.hidden = !open;
  c.textContent = open;
  const runner = S.status.runner;
  document.getElementById('runner').textContent = runner?.last_run ? `Letzter Lauf ${fmtDate(runner.last_run)}` : '';
  if (!S.loaded && view !== 'plan' && view !== 'checkliste') {
    main.innerHTML = `<div class="card empty"><h2>Daten werden geladen</h2><p style="margin-top:10px">${S.offline ? 'Die Datenbank ist in dieser Ansicht nicht erreichbar. Öffnen Sie das Dashboard angemeldet auf claude.ai.' : 'Einen Moment bitte.'}</p></div>`;
    return;
  }
  views[view]();
}

window.addEventListener('hashchange', () => { S.dirty.clear(); render(); });
document.getElementById('pending-btn').onclick = () => { S.dirty.clear(); render(); };

async function start() {
  render();
  const claude = window.claude;
  const db = claude ? await claude.use('db') : null;
  if (!db) {
    S.offline = true;
    render();
    return;
  }
  S.db = db;
  S.assets = await claude.use('assets').catch(() => null);
  S.comments = await claude.use('comments').catch(() => null);
  const onErr = (e) => toast('Datenbank: ' + (e?.message || 'nicht erreichbar'));
  let first = 4;
  const ready = () => { if (--first <= 0) S.loaded = true; render(); };
  db.collection('posts').onSnapshot((snap) => { S.posts = snap.docs.map((d) => ({ id: d.id, ...d.data() })); ready(); }, onErr);
  db.collection('metrics').onSnapshot((snap) => { S.metrics = snap.docs.map((d) => ({ id: d.id, ...d.data() })); ready(); }, onErr);
  db.collection('status').onSnapshot((snap) => { S.status = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()])); ready(); }, onErr);
  db.collection('checklist').onSnapshot((snap) => { S.checklist = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()])); ready(); }, onErr);
}
start();

</script>
