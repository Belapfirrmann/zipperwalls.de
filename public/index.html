<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Media Dashboard</title>
<link rel="icon" href="/assets/bildzeichen-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <img class="logo" src="/assets/logo-weiss.svg" alt="Zipperwalls">
    <nav id="nav">
      <a href="#plan" data-view="plan">Plan</a>
      <a href="#freigabe" data-view="freigabe">Freigabe <span class="count" id="count-freigabe" hidden></span></a>
      <a href="#checkliste" data-view="checkliste">Abhakeliste</a>
      <a href="#zahlen" data-view="zahlen">Zahlen</a>
      <a href="#verbindungen" data-view="verbindungen">Verbindungen</a>
    </nav>
    <div class="who" id="who"></div>
  </aside>
  <main id="main" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
