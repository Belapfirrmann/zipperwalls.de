name = "zipperwalls-social"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
# API, OAuth und Medien laufen immer zuerst durch den Worker
run_worker_first = ["/api/*", "/oauth/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "zipperwalls-social"
database_id = "HIER_NACH_wrangler_d1_create_EINTRAGEN"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "zipperwalls-social-media"

[triggers]
# alle 5 Minuten: geplante Posts senden. Taeglich 04:00 UTC: Kennzahlen holen
crons = ["*/5 * * * *", "0 4 * * *"]

[vars]
# Komma getrennte Liste der Admins (muss mit Cloudflare Access uebereinstimmen)
ADMIN_EMAILS = "bela@beispiel.de,darien@beispiel.de"
# Oeffentliche URL des Dashboards ohne Slash am Ende, z. B. https://social.zipperwalls.de
PUBLIC_BASE_URL = "https://social.zipperwalls.de"
# Cloudflare Access: Team-Domain (xyz.cloudflareaccess.com) und Application AUD Tag
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
GRAPH_VERSION = "v22.0"
LINKEDIN_VERSION = "202506"
# Optional: LinkedIn Unternehmensseite (nur mit genehmigter Community Management API)
LINKEDIN_ORG_ID = ""
# Optional: bestimmte Facebook Seite waehlen, falls mehrere verwaltet werden
META_PAGE_ID = ""
